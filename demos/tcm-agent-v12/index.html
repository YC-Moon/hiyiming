:null,"tongueReport":null,"doctorCard":{"facts":"合谷穴仅在用力按压时疼，平时不碰不疼；无红肿发热、手指发麻和拿东西无力；近期手机、鼠标使用明显增多。","intent":"主要想了解按压痛是否代表脏腑问题；偏好先自行调整，当前为轻需求。","strategy":"先纠正“按痛等于脏腑有病”的误解，给出手部减负和温敷方案；私域低频复评，约定三天反馈变化，不强推药物或疗程。","opening":"您的情况我看过了：只有重按虎口时疼，没有红肿、发麻或拿东西无力，近期手机和鼠标用得明显更多，暂时不需要吃药。\n\n先停止反复重按，每小时把手腕和手指放平活动 1 分钟；没有红肿发热时，晚上可以温敷 10 分钟。\n\n接下来这几天，麻烦您每天睡前给我发一条：今天用手大概多久、疼没疼、疼的程度比昨天轻还是重。一句话就够。我每天看，三天后就能判断需不需要加护具，或者安排您做个手部检查。\n\n中间要是出现不碰也疼、虎口红肿或者拿不住东西，随时发我，不用等到睡前。"}},{"id":"case2","number":2,"title":"西洋参是否适合","health":"轻症","need":"中需求","route":"产品与用药核对","meta":{"原始问题":"西洋参什么人不适合吃？我最近容易累、偶尔嘴干，想系统看看自己能不能吃。"},"rounds":[{"speaker":"用户","user":"西洋参什么人不适合吃？我最近容易累、偶尔嘴干，想系统看看自己能不能吃。","agent":"西洋参并不是人人都能吃，孕期、哺乳期、长期服药，或者服后出现失眠、心慌、腹泻的人，都要先让医生核过。您说的累和口干指向比较宽，一天里什么时候最累？","options":[{"label":"早晨起床后","primary":false},{"label":"下午","primary":true},{"label":"晚上","primary":false},{"label":"一整天都明显","primary":false}],"multi":false,"prefill":"","tonguePrompt":false,"trace":{"health":"轻症","need":"中需求","basis":"尚无中重症表现；用户明确希望个体化判断。","next":"先给禁忌边界，再从乏力的时间规律入手。"}},{"speaker":"用户","user":"下午。","agent":"下午明显、早晨还好，这更像一天消耗累积出来的疲劳，不是气血不足那种一起床就没劲。那么这种情况持续多久了？","options":[{"label":"不到1周","primary":false},{"label":"1—2周","primary":true},{"label":"1个月以上","primary":false},{"label":"反复很久","primary":false}],"multi":false,"prefill":"","tonguePrompt":false,"trace":{"health":"轻症","need":"中需求","basis":"下午为主、晨起尚可，更像消耗累积，不是典型气虚的\"晨起即乏\"。","next":"确认病程长短。"}},{"speaker":"用户","user":"1—2周。","agent":"一两周，属于新出现的。这种乏力有没有影响到您的工作或日常活动？","options":[{"label":"基本不影响工作","primary":true},{"label":"工作效率明显下降","primary":false},{"label":"日常活动受限","primary":false},{"label":"稍微活动就很累","primary":false}],"multi":false,"prefill":"","tonguePrompt":false,"trace":{"health":"轻症","need":"中需求","basis":"病程较短，暂无持续加重信息。","next":"先确认乏力是否影响工作和日常活动，用功能变化判断是否需要优先检查。"}},{"speaker":"用户","user":"基本不影响工作。","agent":"不影响工作，严重度偏轻。您是否有以下情况？（可多选）","options":[{"label":"心慌","primary":false},{"label":"头晕","primary":false},{"label":"体重明显下降","primary":false},{"label":"都没有","primary":true}],"multi":true,"prefill":"","tonguePrompt":false,"trace":{"health":"轻症","need":"中需求","basis":"乏力尚未影响工作和日常活动，功能状态稳定。","next":"继续确认是否伴随心慌、头晕或体重下降，决定是否需要先做基础检查。"}},{"speaker":"用户","user":"都没有。","agent":"没有心慌、头晕和体重下降，那最常见的原因就落在作息上。您平时通常几点睡？","options":[{"label":"23点前","primary":false},{"label":"23—24点","primary":false},{"label":"0—2点","primary":false},{"label":"经常2点以后","primary":true}],"multi":false,"prefill":"","tonguePrompt":false,"trace":{"health":"轻症","need":"中需求","basis":"无功能受限，也没有心慌、头晕和体重明显下降。","next":"转向作息规律，验证短期乏力是否与长期晚睡相关。"}},{"speaker":"用户","user":"经常2点以后。","agent":"经常凌晨两点后入睡，一两周下来下午没劲很常见。您是否长期服用什么药？有的话麻烦把药名和用法写给我。","options":[],"multi":false,"prefill":"氨氯地平，每天一次；没有服用其他药物。","tonguePrompt":false,"trace":{"health":"轻症","need":"中需求","basis":"长期凌晨入睡与下午乏力的时间规律吻合，权重高于是否需要进补。","next":"核对长期用药，避免在不了解降压药和血压情况时直接建议进补。"}},{"speaker":"用户","user":"氨氯地平，每天一次；没有服用其他药物。","agent":"","options":[],"multi":false,"prefill":"","tonguePrompt":true,"trace":{"health":"轻症","need":"中需求","basis":"无不耐受表现；但长期服降压药，产品与用法需人工核对。","next":"按规则触发舌诊，允许跳过；本 Case 走上传路线。"}}],"summary":[],"leadPrompt":"您可以加我的微信，我会结合您的氨氯地平、近期血压和这次的舌象把问诊补齐，再决定要不要用药、用哪一路，并约好下一次看下午乏力和口干变化的时间。这类方案需要随反应调整，不建议拿一张固定方长期吃。","followups":["想用西洋参需要先注意什么？","怎么判断乏力是熬夜造成的还是需要调理？","还有哪些不靠补品的改善方法？"],"report":{"diagnostic":"近两周下午轻度乏力、偶尔口干，与长期凌晨入睡的关系最大。舌象未见阴虚或痰湿的支持性表现，目前不构成\"气阴两虚\"，也没有服用西洋参的必要指征。正在服用氨氯地平，任何草本产品都需要先核对成分与相互作用。","evidence":["乏力约两周，集中在下午，基本不影响工作；无心慌、头晕、体重下降。","经常凌晨两点以后入睡，睡眠时长明显不足，与下午疲劳的时间规律吻合。","舌质淡红、苔薄白、舌面尚润；无少苔、裂纹、厚腻苔，不支持阴虚或痰湿。","正在服氨氯地平（用户自述：每天一次）。尚未核实：近期血压数值、家中是否有血压计、食物过敏史、特殊饮食要求、是否已购买具体西洋参产品。"],"advice":"建议先用一周把入睡时间往前挪、三餐规律，并记录乏力时段。西洋参本次不开始。一周后作息已改善而乏力仍在，再按处方页列出的核查项去门诊。","tabs":{"处方":"<h3>一、中医辨证</h3>\n<p><strong>暂不立证</strong>，倾向\"作息失宜、气机未复\"，<strong>未达气阴两虚</strong>。</p>\n<h3>二、辨证分析</h3>\n<p>您的乏力有明确时段（下午）、明确诱因（长期凌晨入睡）、病程短（两周），而舌象与功能状态都没有虚证的支撑点：舌不少苔、不干裂，说明津液未伤；不影响工作、无心慌气短，说明气未大虚。</p>\n<p>中医讲\"无虚不补\"。在这种情况下先用补气养阴的药，常见的结果是口干反而加重、腹胀，或者入睡更难——因为原本的问题是熬夜造成的功能性疲劳，不是物质不足。所以本次的处理是<strong>先撤诱因</strong>，而不是先开方。这也是\"西洋参什么人不适合吃\"在您身上的真实答案：不是您体质不适合，而是您现在<strong>还不需要</strong>。</p>\n<h3>三、参考处方方向（面诊讨论用，非可抓处方）</h3>\n<p><strong>本次不开方。</strong>若一周后作息已明显改善、乏力仍在，且医师面诊后确认属气阴不足，可在<strong>生脉思路</strong>上讨论：</p>\n<ul><li><strong>组成方向｜</strong>西洋参（或人参）、麦冬、五味子为基础，酌加太子参、黄芪。</li>\n<li><strong>君药｜</strong>西洋参、麦冬。</li>\n<li><strong>方义｜</strong>益气与生津同用；五味子酸收，避免单纯补气而更燥、更耗津。这一路的用意是\"补而不燥\"，正对应您口干与乏力并存的情况。</li></ul>\n<h3>四、用药边界</h3>\n<ul><li>以上只是面诊时的讨论方向，<strong>不是可以照抓的处方</strong>：未列剂量、未定加减、未核对与氨氯地平的相互作用。</li>\n<li>您正在服降压药。人参类对血压以及部分药物代谢均可能产生影响，<strong>必须由医师面诊后</strong>决定是否使用、用多少、是否需要同期监测血压。</li>\n<li>不自行到药房按上述药名抓药，不同时叠加多种滋补品，不把\"药食同源\"当作可以随意服用的理由。</li>\n<li>需要补齐的核查项：近一周血压记录（如家中有血压计）、乏力时段记录、若已购买产品则核对其成分与剂型。</li></ul>\n<p><strong>建议您咨询医生｜</strong>如果一周后作息已调整、乏力仍在，或者您确实想试西洋参，<strong>建议您点击下方留资卡添加医生企业微信</strong>，把记录和产品包装一起给医生看，由医生面诊后判断需不需要用、用哪一路、要不要监测血压。这一步不建议自己决定。</p>\n\n","生活建议":"<h4>作息</h4>\n<p>固定起床时间，入睡时间每天往前挪 15 分钟，先做到 24 点。这一条对您的下午乏力权重最大，比任何进补都靠前。</p>\n<h4>饮食</h4>\n<p>三餐保留主食、蔬菜和蛋白质，白天分次饮水。不用大量咖啡、甜食或补品去抵消晚睡，它们只会把疲劳往后推。</p>\n<h4>用药</h4>\n<p>氨氯地平按原处方使用，不自行调整。西洋参和其他滋补品这段时间先不开始，也不要同时叠加多种。</p>\n<h4>要记录的</h4>\n<p>睡眠时长、三餐时间与下午乏力的对应关系；有咖啡习惯的，把用量和时间一并记下来。</p>\n<h4>出现这些情况随时告诉我</h4>\n<p>乏力持续不改善，或者出现明显口渴多尿、体重变化、头晕心慌。如果出现胸痛、气短或晕厥，先急诊，别等我的回复。</p>\n","食疗":"<p>以下为两款可轮换的家常食膳，每次选一款即可。材料量按整锅列出，食用量按本人的正餐和加餐调整；不另加未核对的中药，不把食膳当作治疗处方。</p>\n<h3>山药莲子瘦肉汤</h3>\n<p><strong>食膳介绍｜</strong>以山药、莲子健脾和中的传统食养思路，配瘦肉做成清淡汤膳，适合放进正餐，兼顾食材与蛋白质摄入。</p>\n<p><strong>食材｜</strong>瘦肉250克，生菜心适量，清水1200毫升。</p>\n<p><strong>食药两用食材｜</strong>干山药25克、莲子20克、大枣3枚；这份食膳不另加补气药材。</p>\n<p><strong>辅料｜</strong>食盐少许。</p>\n<p><strong>做法｜</strong>莲子洗净去芯后浸泡；山药洗净，大枣去核。瘦肉切块焯水，与山药、莲子、大枣加水煮开，转小火炖约45—60分钟至莲子软熟；加生菜心煮熟，少盐调味。</p>\n<p><strong>份量与吃法｜</strong>全量约2—3人份。每次取一小碗，连肉和山药一起吃，作为正餐的一道菜；不靠多喝汤代替一餐。</p>\n<p><strong>适用与调整｜</strong>适合目前食欲尚可、希望温和食养的成年人。山药、莲子计入主食份量；有控糖或限液要求时调整份量。食后腹胀加重则减量或停用。</p>\n<h3>百合银耳雪梨羹（家常版）</h3>\n<p><strong>食膳介绍｜</strong>沿用百合、银耳、雪梨的清润食养搭配，作为偶尔口干时的清淡加餐。它不是抗疲劳补品，仍需先补足睡眠和正餐。</p>\n<p><strong>食材｜</strong>雪梨1个，干银耳15克，清水1000毫升。</p>\n<p><strong>食药两用食材｜</strong>食用百合15克；这份食膳<strong>不加</strong>原配方中的枸杞子。</p>\n<p><strong>辅料｜</strong>不另加冰糖、蜂蜜。</p>\n<p><strong>做法｜</strong>银耳按包装提示泡发，去硬蒂撕小朵，百合洗净。银耳加水煮开后转小火煮约30分钟，加入百合及去核切块的雪梨，续煮约15—20分钟至熟软。</p>\n<p><strong>份量与吃法｜</strong>全量约3—4小份。放温后取一小碗作加餐，每周2—3次，不必天天喝；现做现吃，剩余及时冷藏并尽快食用。</p>\n<p><strong>适用与调整｜</strong>适合目前无明显腹泻、能正常进食的成人。腹泻或食后腹胀时暂停；控糖者将梨计入水果份量，不因\"不加糖\"而不限量。</p>\n\n","穴位":"<p>您现在并不需要靠强刺激穴位提神。以下只供温和放松时参考，不能据此决定西洋参的用法。</p>\n<h3>足三里</h3>\n<p><strong>位置／范围｜</strong>小腿前外侧，髌骨下缘外侧凹陷向下约四横指、胫骨前缘外侧约一横指处。</p>\n<p><strong>选用理由／判断｜</strong>传统用于健脾和胃、调养疲倦；这里主要作为放松辅助。</p>\n<p><strong>操作／安排｜</strong>坐稳后用指腹轻揉30—60秒，每侧一次；以舒适为度，不追求明显疼痛。</p>\n<h3>内关</h3>\n<p><strong>位置／范围｜</strong>前臂掌侧，腕横纹上约三横指、两条肌腱之间。</p>\n<p><strong>选用理由／判断｜</strong>传统用于宁心和胃；可在紧张或工作间歇作轻柔放松，不用来掩盖新出现的胸闷心慌。</p>\n<p><strong>操作／安排｜</strong>轻揉约30秒，出现麻、电击样痛或不适立即停止。</p>\n<p><strong>使用边界｜</strong>皮肤破损、红肿处不按，不自行针刺或艾灸。位置拿不准时先由专业人员指出；新出现胸痛、明显心慌或头晕时先评估原因。</p>\n<p>以上为在线初步建议，非处方。</p>\n\n"},"defaultTab":"处方","trace":null},"resultType":"report","tongueAction":"upload","tongueAgent":"氨氯地平是降压药，能不能加西洋参必须把它算进去。给结论前我想看一眼您的舌象，判断您是不是真的虚，避免把熬夜造成的疲劳当成进补的理由。方便的话按提示拍一张，不方便可以跳过。","tongueFeedback":"舌质淡红、苔薄白、舌面尚润，没有少苔或干裂，目前舌象并不支持\"需要进补\"。","tongueTrace":{"health":"轻症","need":"中需求","basis":"已完成舌诊；舌象仅辅助体质判断，不能替代血压与产品核对。","next":"舌象信息已获得，结合问诊和用药信息生成详细报告。"},"tongueReport":null,"doctorCard":{"facts":"近1—2周下午容易累、偶尔口干，基本不影响工作；无心慌、头晕和体重明显下降；经常凌晨2点以后入睡；长期服用氨氯地平每日一次，无其他用药；舌质淡红、苔薄白、舌面尚润。","intent":"希望系统判断自己是否适合西洋参；关心能否安全、有效地使用，属于中需求，但没有主动要求处方。","strategy":"先判断“有没有必要用”，再核对近期血压、真实产品和现用药；给出可以短期尝试、暂不建议或补充检查后三类明确结论，不因接受完整方案就自动开方。","opening":"您的情况我看过了：近一两周下午乏力、偶尔口干，不影响工作，没有心慌、头晕和体重下降；经常凌晨两点后睡，正在服氨氯地平；舌象目前不支持必须进补。\n\n西洋参这件事先不启动，不是您体质不适合，是现在还不需要。这周先把入睡时间往前挪，每天挪 15 分钟，先做到 24 点；三餐固定，别用咖啡顶下午。\n\n麻烦您每晚发我昨晚几点睡、今天下午累不累（轻、中、重三档就行）。家里有血压计的话，早晚各测一次一起发我。这样我三五天就能看出这个乏力是熬夜造成的，还是要按气阴不足处理。\n\n另外想确认一下，西洋参您买了吗？如果买了，把包装正反面拍给我，我核对成分和剂型，在那之前先别开始吃。"}},{"id":"case3","number":3,"title":"健脾散与心脏药","health":"轻症","need":"重需求","route":"焦虑复核不迎合","meta":{"原始问题":"五行健脾散什么时候吃最好？我还在吃心脏药。"},"rounds":[{"speaker":"用户","user" ue,"trace":{"health":"轻症","need":"重需求","basis":"已获现用药名称与用法；尼可地尔具胃肠溃疡已知风险，成为本例主要安全点。","next":"触发舌诊并说明其边界；本 Case 走跳过路线。"}}],"summary":[],"leadPrompt":"您可以加我的微信，把健脾散的包装和成分发我，我核对完直接告诉您能不能吃、什么时候吃、要不要错开，同时把尼可地尔的胃部风险一起算进去。这件事口头说不清，看到实物才敢下结论。","followups":["同时服药时需要注意什么？","怎样减少以后自行用药的风险？","中医舌诊查看更准确信息"],"report":{"diagnostic":"近一周偶发饭后胃胀，无消化道危险表现；健脾散尚未服用，因此不存在已经发生的联合用药反应。中医可从胃气不和、饮食停滞方向考虑，但一周的新发胀满不足以定为脾虚，也不能凭\"胃胀\"就选健脾类药。本例真正需要优先处理的是尼可地尔的胃肠溃疡风险与产品成分核对。","evidence":["饭后胃胀不足一周、程度偶发；无黑便、呕血、呕吐、进行性腹痛、夜间痛醒。","健脾散尚未服用。包装标注类别、完整成分与配料表均尚未核实，因此现在无法给出\"能否合用\"\"间隔几小时\"的结论，建议您把包装拍给医生核对后再定。","尼可地尔5毫克、每日3次为用户自述的现有医嘱，非本报告开出；该药有胃肠道溃疡与穿孔的已知风险。","本次跳过舌诊，报告不引用任何舌象。尚未核实：既往胃病史、幽门螺杆菌情况、近期是否已自行服用护胃药。"],"advice":"健脾散先不开始，尼可地尔按原医嘱不动，也不自行加护胃药。建议您把包装正反面（标注类别、成分、配料表、批准文号、用法）拍给医生核对清楚。饭后胀先从减少单餐量、放慢进食、餐后不立刻躺下开始。胀满持续超过两周或加重，主动向开尼可地尔的医生反馈。","tabs":{"处方":"<h3>一、中医辨证</h3>\n<p><strong>暂不立证</strong>，倾向\"食滞胃脘、胃气不和\"（新发、轻度）。</p>\n<h3>二、辨证分析</h3>\n<p>您的胀出现在饭后、病程不到一周、大便性状没变、食欲也没有明显下降，这更像单次或几次进食过量之后胃气不降，而不是脾气虚弱。中医里这两者的处理方向正好相反：<strong>食滞要消、要行；脾虚要补、要温</strong>。</p>\n<p>名字里带\"健脾\"的产品多数偏补。用在新发的食滞上，等于在已经堵住的地方再加东西，常见结果是<strong>更胀</strong>。这是不建议您现在开始吃的第一个理由——与它和心脏药能不能同服无关，是它本身此刻就可能不对症。</p>\n<h3>三、参考处方方向（面诊讨论用，非可抓处方）</h3>\n<p><strong>本次不开方。</strong>若面诊确认为食滞胃脘，通常在<strong>保和思路</strong>上讨论：</p>\n<ul><li><strong>组成方向｜</strong>山楂、六神曲、炒麦芽、莱菔子、陈皮、连翘。</li>\n<li><strong>君药｜</strong>山楂、六神曲、莱菔子。</li>\n<li><strong>方义｜</strong>三味分别消解肉食、谷面、气壅之积；陈皮行气除胀，连翘清食积所化之热。全方是\"消\"而不是\"补\"。</li>\n<li><strong>另一条路｜</strong>若面诊后确认确属脾虚（长期、食少、便溏、乏力），则改走香砂六君思路（党参、白术、茯苓、陈皮、半夏、木香、砂仁）。<strong>两条路不可同时套用</strong>，这正是\"同名产品不能只看名字\"的原因。</li></ul>\n<h3>四、用药边界</h3>\n<ul><li>以上不是可以照抓的处方，未列剂量、未定加减。</li>\n<li><strong>本例特有风险：</strong>您正在服尼可地尔，该药有胃肠溃疡与穿孔的已知风险。任何\"消导\"或\"护胃\"用药都需要医师同时评估溃疡与出血风险后再决定。</li>\n<li>健脾散在标注类别与完整成分核对前不要开始，<strong>也不要用\"错开两小时\"代替相互作用核对</strong>——错开时间只减少吸收干扰，不减少黏膜损伤风险。</li>\n<li>不自行调整尼可地尔的剂量或次数；胃部症状变化要让开这个药的医生知道。</li></ul>\n<p><strong>建议您咨询医生｜</strong>能否与尼可地尔同用，需要医生逐条核对成分后才能回答。<strong>建议您点击下方留资卡添加医生企业微信</strong>，把包装的标注类别、成分配料表和批准文号拍给医生；同时也建议把这次胃胀告知开尼可地尔的那位医生。</p>\n\n","生活建议":"<h4>怎么吃</h4>\n<p>三餐定时、放慢速度、减到七八分饱，餐后半小时不躺下。这一周先不吃到明显撑胀的量，胀的次数会自己减少。</p>\n<h4>用药这块先按住</h4>\n<p>健脾散在标注类别和完整成分核对清楚之前不要开始；不自行增加护胃药；尼可地尔按原医嘱不动。<strong>\"错开两小时\"不能代替相互作用核对</strong>，错开时间只减少吸收干扰，不减少黏膜损伤风险。</p>\n<h4>活动</h4>\n<p>餐后按您原有的心脏病活动医嘱轻度走动即可，不额外加量。</p>\n<h4>要准备给我的</h4>\n<p>包装的标注类别、完整成分、配料表、批准文号和建议用法，拍清楚发过来。</p>\n<h4>出现这些情况随时告诉我</h4>\n<p>黑便、呕血、持续加重的腹痛或者头晕欲倒，这几项不要继续自行调理。胃肠症状有变化，也要让开尼可地尔的那位医生知道。</p>\n","食疗":"<p>以下为两款可轮换的家常食膳，每次选一款即可。材料量按整锅列出；不另加未核对的中药，不把食膳当作治疗处方。</p>\n<h3>山药小米粥（家常版）</h3>\n<p><strong>食膳介绍｜</strong>保留原食膳以小米、大米、山药为基础的健脾和胃思路，做成软熟主食。这里先采用不另加中药的版本。</p>\n<p><strong>食材｜</strong>小米60克，大米20克，清水1000毫升。</p>\n<p><strong>食药两用食材｜</strong>干山药20克；这份食膳<strong>不加</strong>党参、茯苓。</p>\n<p><strong>辅料｜</strong>不必加糖，可不放盐。</p>\n<p><strong>做法｜</strong>小米、大米淘洗，干山药洗净。加水煮开后转小火煮约30—40分钟至山药和米粒软熟，其间适度搅拌防粘底；按实际蒸发量补水。</p>\n<p><strong>份量与吃法｜</strong>全量约2人份。取一小碗作早餐或正餐的一部分，搭配鸡蛋、豆腐等蛋白质和蔬菜；不连续只喝白粥或只喝粥水。</p>\n<p><strong>适用与调整｜</strong>适合目前偶尔饭后胀、无呕吐或进行性腹痛时少量进食。若喝粥后反酸、腹胀更明显，改回本人更耐受的普通主食；控糖者按主食份量食用。</p>\n<h3>山楂橘皮饮（家常版）</h3>\n<p><strong>食膳介绍｜</strong>沿用榕树家山楂配橘皮的理气消食搭配，做成不加糖的温饮，适合正餐吃多之后代替甜饮料。</p>\n<p><strong>食材｜</strong>温水500毫升。</p>\n<p><strong>食药两用食材｜</strong>山楂10克、橘皮（陈皮）4克。</p>\n<p><strong>辅料｜</strong>不加糖，不做高糖版本。</p>\n<p><strong>做法｜</strong>山楂、橘皮略洗，加水煮开后转小火煮约10分钟，滤出温饮。</p>\n<p><strong>份量与吃法｜</strong>全量约2小杯。饭后1小时内取一小杯温饮，每天不超过2杯，连续不超过3天。</p>\n<p><strong>适用与调整｜</strong><strong>本例需特别注意：</strong>山楂偏酸，您正在服尼可地尔且该药有胃黏膜损伤风险，若饮后出现反酸、烧心或胃部不适应立即停用。空腹不饮。有反酸或胃溃疡病史者不选此款，改用上面的山药小米粥。</p>\n\n","穴位":"<p>当前以核对药物和观察胃胀为先。若只是短暂饭后胀、无持续腹痛，可把轻柔按揉当作放松，不以穴位替代药物安全判断。</p>\n<h3>足三里</h3>\n<p><strong>位置／范围｜</strong>小腿前外侧，外膝眼下约四横指、胫骨前缘外侧约一横指处。</p>\n<p><strong>选用理由／判断｜</strong>传统用于健脾和胃，适合讨论日常脾胃调养时作辅助。</p>\n<p><strong>操作／安排｜</strong>坐位轻揉，每侧30—60秒；不在吃得很撑时用力按压腹部。</p>\n<h3>内关</h3>\n<p><strong>位置／范围｜</strong>腕掌侧横纹上约三横指、两筋之间。</p>\n<p><strong>选用理由／判断｜</strong>传统用于和胃、缓解紧张时的不适；不根据它判断有无心脏或胃肠急症。</p>\n<p><strong>操作／安排｜</strong>以指腹轻揉约30秒，出现麻痛立即停；胸痛、冷汗或气促时不继续按穴等待。</p>\n<p><strong>使用边界｜</strong>不自行针刺，不重揉腹部；病因不明的持续腹痛及新发胸部不适应及时就医。</p>\n<p>以上为在线初步建议，非处方。</p>\n\n"},"defaultTab":"处方","trace":null},"resultType":"report","tongueAction":"skip","tongueAgent":"尼可地尔有胃肠黏膜溃疡的已知风险，所以这个胃胀更不能自己加药去压。舌象只作补充，能不能合用要靠成分和说明书，所以现在不方便拍也不影响，可以跳过。","tongueFeedback":"","tongueTrace":{"health":"轻症","need":"重需求","basis":"用户希望用最快的可验证路径拿到明确答复。","next":"现有信息足以完成风险判断，直接生成用药必要性与合用边界报告。"},"tongueReport":{"summary":"苔白稍腻，偏向饮食停滞而非脾气虚弱，可补充本次辨证。","appearance":"舌质淡红，舌中部苔白稍腻，舌体未见明显胖大，舌面尚润。","context":"舌体不胖、无齿痕，说明脾虚的形态学线索并不明显；而舌中苔白稍腻，与近一周的饭后胀放在一起，更支持食滞在中焦。这印证了处方页的判断：现在不适合走\"补\"的一路。仍需结合进食量、腹部查体和用药情况，不能据此判定健脾散可以与尼可地尔合用。","regions":{"心肺":"舌尖淡红，无突出的舌面干燥。不能因为舌尖外观平和就判断心脏病稳定或改变尼可地尔医嘱。","脾胃":"舌中部白苔稍腻。与饭后胀是同一组参考信息，支持继续关注饮食量与中焦运化；不等于确诊胃炎或药物性溃疡。","肾肠":"舌根见白苔，表面尚润。未提供新的排便异常，仍保留前面\"无黑便\"的问诊信息；舌照不能排除消化道出血。","肝胆":"舌两侧淡红，无明显局部变化。可以记录紧张是否加重胃胀，但不能据此认定肝郁或某种心脏药副作用。"},"attention":["持续关注 · 饭后胃胀｜记录持续时间及是否加重；出现持续腹痛、黑便应及时就医。","仍需完成 · 产品与药物核对｜本次舌诊补充了中焦信息，不改变健脾散暂不开始的结论。","中医调养建议｜继续按前份报告规律进餐、避免一次过饱，家常食膳小份尝试。健脾散成分未核对前先不服，不自行加护胃药；建议把新舌照和已有用药信息一并交给医生。"],"advice":"继续按前份报告规律进餐、避免一次过饱，家常食膳小份尝试。健脾散成分未核对前先不服，不自行加护胃药；建议把新舌照和已有用药信息一并交给医生。","agent":"舌象和前面的判断一致，舌不胖、无齿痕，中部苔白稍腻，偏食滞、不偏脾虚。所以健脾散仍先不开始，用药核对的建议不变。"},"doctorCard":{"facts":"饭后胃胀不足1周；无黑便或呕血、呕吐、疼痛持续加重及夜间痛醒；五行健脾散尚未服用；尼可地尔5毫克每日3次，无其他药；问诊阶段跳过舌诊。","intent":"强烈担心药物冲突，希望尽快获得明确答复；重需求主要由焦虑驱动。","strategy":"快速回应“能不能合用”，但不以加药缓解焦虑；先让用户发送包装四面、成分表和说明书，核对产品与尼可地尔的相互作用，再决定是否需要面诊。","opening":"您的情况我看过了：饭后胃胀不到一周，没有黑便、呕吐、持续加重或夜间痛醒；健脾散还没开始吃，尼可地尔 5 毫克每天 3 次在服。后来补拍的舌照显示舌中苔白稍腻，更偏食滞，不支持直接走健脾进补。\n\n这里有一件事要先跟您说明。尼可地尔本身有胃肠溃疡的已知风险，所以这个胃胀不建议自己加药压下去；而名字里带\"健脾\"的产品多数偏补，用在新发的食滞上可能反而更胀。这两条是我建议先不吃的原因。\n\n麻烦您现在做三件事：把包装的正面、成分配料表、批准文号拍三张照片发我，我逐条核对；尼可地尔按原医嘱不要动；今天起吃饭减到七八分饱、餐后半小时不躺。\n\n照片发来我就给您明确答复：能不能吃、什么时候吃、要不要错开。另外想问一下，这次胃胀您在线下看过医生吗？如果开尼可地尔的医生还不知道这件事，建议尽快让他知道。"}},{"id":"case4","number":4,"title":"白痰反复三周","health":"中症","need":"轻需求","route":"低成本阶段方案","meta":{"原始问题":"脾虚引起的白痰是什么原因？我想先靠饮食调理，不太想吃药。"},"rounds":[{"speaker":"用户","user":"脾虚引起的白痰是什么原因？我想先靠饮食调理，不太想吃药。","agent":"白痰不等于脾虚，它可能来自呼吸道，也可能是鼻咽的分泌物往下滴。短期的多和一次感染有关，拖久的要另做评估。您这种情况持续多久了？","options":[{ rue},{"label":"经常黏马桶","primary":false},{"label":"经常腹泻","primary":false}],"multi":false,"prefill":"","tonguePrompt":false,"trace":{"health":"中症","need":"轻需求","basis":"食欲轻度下降，为脾胃运化偏弱增加了一条线索。","next":"确认大便状态，完成当前问题所需的脾胃信息。"}},{"speaker":"用户","user":"大便偶尔黏马桶。","agent":"","options":[],"multi":false,"prefill":"","tonguePrompt":true,"trace":{"health":"中症","need":"轻需求","basis":"胃口偏差和大便偶尔黏，与白黏痰共同提示脾胃运化偏弱可能参与，但不能解释全部病因。","next":"已有信息支持进一步观察舌象，用于辅助中医判断，同时保留三周病程的检查门槛。"}}],"summary":[],"leadPrompt":"您可以加我微信，七天的痰量、胃口和大便记录直接发我，我看趋势，再决定饮食这条路够不够、要不要加别的手段。以后日常饮食怎么调、能不能吃某种食材，也都可以随时问我。","followups":["白痰期间饮食需要注意什么？","白痰缓解后怎样防止反复？","还适合哪些不吃药的调理方法？"],"report":{"diagnostic":"白色黏痰持续三周以上、晨起为多，无危险表现。舌体稍胖、边缘齿痕、苔白略腻，结合胃口偏差与大便偶尔黏，中医可辨为脾虚生湿、湿聚成痰的倾向。但三周以上的咳痰不能仅按脾虚处理，需完成一次呼吸道与鼻咽评估。","evidence":["白黏痰三周以上，晨起最多；无发热、胸闷气短、痰中带血、体重下降、夜间盗汗。","胃口比平时差一点，大便偶尔黏马桶。","舌体稍胖、边缘齿痕、苔白略腻，与上述脾胃表现方向一致，可作为痰湿倾向的辅助线索。","尚未核实：吸烟史、职业粉尘接触、过敏史、鼻部症状（鼻塞、后滴感）、是否有反酸。这几项是三周以上咳痰最常见的原因，需在门诊补齐；舌象不能替代这部分评估。"],"advice":"饮食调理可以现在就开始：规律三餐、减少甜腻与油炸、晚餐早一点。同时建议安排一次全科或呼吸科评估，就诊时把\"三周以上\"\"白黏痰\"\"晨起为多\"三句直接告诉医生。出现发热、气短、痰中带血，不要等预约。","tabs":{"生活建议":"<h4>饮食</h4>\n<p>三餐定时。如果平时有甜食、奶茶、油炸和睡前加餐的习惯，这一周先减少，它们会让痰更黏，夜间咽喉往下滴也更明显。</p>\n<h4>起居</h4>\n<p>晨起先漱口，再喝几口温水，帮助把夜里积下来的痰带出去。这是针对您晨起痰最多的直接应对。</p>\n<h4>要记录七天的</h4>\n<p>每天痰的量、颜色、最多出现的时段，以及有没有鼻塞和咽喉后面往下滴的感觉。</p>\n<h4>不建议自己做的</h4>\n<p>三周以上的白痰不要当成单纯脾虚一直靠食疗观察下去；也不要自行长期服化痰中成药或抗生素。</p>\n<h4>出现这些情况随时告诉我</h4>\n<p>发热、气短、痰中带血、体重下降。这几项一出现就不要等记录满七天。</p>\n","食疗":"<p>以下为两款可轮换的家常食膳，每次选一款即可。材料量按整锅列出；不另加未核对的中药，不把食膳当作治疗处方。</p>\n<h3>山药小米粥（家常版）</h3>\n<p><strong>食膳介绍｜</strong>以小米、大米、山药为基础的健脾和胃思路，做成软熟主食，适合胃口偏差时的早餐。</p>\n<p><strong>食材｜</strong>小米60克，大米20克，清水1000毫升。</p>\n<p><strong>食药两用食材｜</strong>干山药20克；这份食膳<strong>不加</strong>党参、茯苓。</p>\n<p><strong>辅料｜</strong>不必加糖，可不放盐。</p>\n<p><strong>做法｜</strong>小米、大米淘洗，干山药洗净。加水煮开后转小火煮约30—40分钟至软熟，其间适度搅拌防粘底。</p>\n<p><strong>份量与吃法｜</strong>全量约2人份。取一小碗作早餐，另配一个鸡蛋和蔬菜；不连续只喝白粥或只喝粥水。</p>\n<p><strong>适用与调整｜</strong>适合目前胃口偏差、无发热与呕吐时食用。喝后反酸或腹胀更明显，改回本人更耐受的普通主食；控糖者按主食份量计。</p>\n<h3>薏苡仁茯苓粥（家常版）</h3>\n<p><strong>食膳介绍｜</strong>沿用榕树家薏苡仁配茯苓的基础祛湿组合，做成粥最稳妥，适合大便偶尔黏、苔腻时的日常主食。</p>\n<p><strong>食材｜</strong>大米40克，小米30克，清水1000毫升。</p>\n<p><strong>食药两用食材｜</strong>薏苡仁25克；这份食膳<strong>不加</strong>原配方中的茯苓12克（未经医生核对前不自行加入）。</p>\n<p><strong>辅料｜</strong>不加糖，可不放盐。</p>\n<p><strong>做法｜</strong>薏苡仁提前浸泡2小时以上；与淘洗好的大米、小米一同加水煮开，转小火煮约40—50分钟至薏苡仁开花软熟。</p>\n<p><strong>份量与吃法｜</strong>全量约2人份。取一小碗作正餐主食，每周3—4次即可，不必天天吃。</p>\n<p><strong>适用与调整｜</strong>适合大便偏黏、无腹泻者。<strong>孕期不选此款</strong>；大便已偏干或本身容易口干者减量。它不是化痰药，痰量没有减少不代表\"没吃够\"。</p>\n\n","穴位":"<p>穴位在这里只作日常调养的辅助，不替代三周以上咳痰的评估。以下两穴都便于自己找到，不需要针刺。</p>\n<h3>足三里</h3>\n<p><strong>位置／范围｜</strong>小腿前外侧，外膝眼下约四横指、胫骨前缘外侧约一横指处。</p>\n<p><strong>选用理由／判断｜</strong>传统用于健脾和胃。您的胃口偏差、大便偶尔黏属脾胃运化偏弱，这一穴与本次辨证方向一致。</p>\n<p><strong>操作／安排｜</strong>坐位用指腹轻揉，每侧30—60秒，每天1—2次；以局部微酸为度。</p>\n<h3>丰隆</h3>\n<p><strong>位置／范围｜</strong>小腿前外侧，外踝尖与外膝眼连线的中点附近，胫骨前缘外侧约两横指。</p>\n<p><strong>选用理由／判断｜</strong>传统的化痰要穴，多用于痰多、苔腻，与本次痰湿倾向对应。它改善的是主观的黏腻感，<strong>不能用痰量变化来判断疗效</strong>。</p>\n<p><strong>操作／安排｜</strong>指腹轻揉约30—60秒；位置拿不准时先由专业人员指出，不自行深压或针刺。</p>\n<p><strong>使用边界｜</strong>皮肤破损、红肿处不按。出现发热、气短、痰中带血时停止按揉，直接就医。</p>\n<p>以上为在线初步建议，非处方。</p>\n\n"},"defaultTab":"生活建议","trace":null},"resultType":"report","tongueAction":"upload","tongueAgent":"胃口差、大便偶尔黏，和白黏痰放在一起确实有痰湿的影子。舌象是这条线上最直接的证据，麻烦按提示拍一张。不方便就点跳过中医舌诊。","tongueFeedback":"舌体稍胖、边缘有齿痕，苔白略腻，和您胃口差、大便偶尔黏是同一组表现，提示脾胃运化偏弱。","tongueTrace":{"health":"中症","need":"轻需求","basis":"舌照辅助观察，不改变\"三周病程需门诊评估\"的要求。","next":"结合病程、痰的特征、脾胃表现与舌象生成详细报告，并保留必要检查门槛。"},"tongueReport":null,"doctorCard":{"facts":"白色偏黏痰持续3周以上、晨起最多；无发热、胸闷气短、痰中带血、体重明显下降和夜间盗汗；胃口比平时差一点，大便偶尔黏马桶；舌体稍胖、边缘有齿痕、苔白略腻。","intent":"希望优先饮食与生活调理，不太想吃药，属于轻需求。","strategy":"先确认饮食调整是否执行正确，不急于开方；同步三周以上病程和风险阴性信息，建议完成一次呼吸道与鼻咽评估，并约定复评节点。","opening":"您的情况我看过了：白色黏痰持续三周以上、晨起最多，胃口偏差、大便偶尔黏；没有发热、气短、痰血、体重下降和夜间盗汗。舌象提示脾胃运化偏弱，但不能把全部原因都归到脾虚上。\n\n饮食这条现在就能开始，具体按报告里的生活建议做。同时三周以上的咳痰我需要一个客观依据，麻烦您去做一个胸片和血常规，报告出来直接发我，我看完再定这条饮食路够不够、要不要换手段。\n\n从今天起麻烦您每天发我一条：今天痰多不多、什么颜色、哪个时段最多，有没有鼻塞或者咽喉后面往下滴。我按天看趋势，比七天后一次性回顾准得多。\n\n另外方便告诉我您是否吸烟、工作是否接触粉尘吗？这两项会直接改变判断方向。"}},{"id":"case5","number":5,"title":"40岁女性反复夜汗","health":"中症","need":"中需求","route":"完整辨证路径","meta":{"原始问题":"女，40岁，半夜睡觉出汗是什么原因？最近工作压力也比较大，我想系统看看。"},"rounds":[{"speaker":"用户","user":"女，40岁，半夜睡觉出汗是什么原因？最近工作压力也比较大，我想系统看看。","agent":"夜里出汗的原因不少，感染、甲状腺、药物、睡眠环境都可能造成同样的表现，得一项项排。您这种情况持续多久了？","options":[{"label":"不到2周","primary":false},{"label":"2周—1个月","primary":false},{"label":"约2个月","primary":true},{"label":"半年以上","primary":false}],"multi":false,"prefill":"","tonguePrompt":false,"trace":{"health":"轻症","need":"中需求","basis":"年龄和夜汗不足以判断严重度或归因为围绝经期；用户明确希望系统了解。","next":"避免仅凭年龄归因于围绝经期，先确认夜汗持续时间。"}},{"speaker":"用户","user":"约2个月。","agent":"两个月，属于需要认真找原因的范围。汗量是判断轻重的关键，您通常出到什么程度？","options":[{"label":"只是微微出汗","primary":false},{"label":"主要后背湿，不用换衣服","primary":true},{"label":"需要换睡衣","primary":false},{"label":"床单也会湿","primary":false}],"multi":false,"prefill":"","tonguePrompt":false,"trace":{"health":"中症","need":"中需求","basis":"病程两个月，属于需要查明原因的范围。","next":"确认汗量——判断轻重的关键，也是门诊最想知道的一项。"}},{"speaker":"用户","user":"主要后背湿，不需要换衣服。","agent":"后背湿、不用换衣服，汗量还不算大，比整夜湿透好得多，先不用往严重方向想。您提到压力大，这种查不出原因的状态本身就让人不安，我们一项项来。最近两个月是否有以下症状？（可多选）","options":[{"label":"白天也潮热","primary":false},{"label":"反复低热","primary":false},{"label":"持续咳嗽","primary":false},{"label":"体重明显下降","primary":false},{"label":"心慌手抖","primary":false},{"label":"都没有","primary":true}],"multi":true,"prefill":"","tonguePrompt":false,"trace":{"health":"中症","need":"中需求","basis":"汗量中等，未达浸湿衣被；先安抚焦虑，再排查危险表现。","next":"一次多选排查结核、甲功、淋巴系统等优先方向。"}},{"speaker":"用户","user":"都没有。","agent":"这些都没有，几个需要优先排查的方向暂时都缺少支持，这是个让人放心的结果。您最近月经规律吗？","options":[{"label":"月经规律","primary":true},{"label":"月经开始不规律","primary":false},{"label":"已经停经","primary":false},{"label":"不确定","primary":false}],"multi":false,"prefill":"","tonguePrompt":false,"trace":{"health":"中症","need":"中需求","basis":"暂无低热、持续咳嗽、体重下降、潮热或心慌手抖等优先风险线索。","next":"单独确认月经状态，判断围绝经期方向是否获得支持。"}},{"speaker":"用户","user":"月经规律。","agent":"月经还规律，那也不能简单归到围绝经期上。您平时通常几点睡？","options":[{"label":"23点前","primary":false},{"label":"23—24点","primary":false},{"label":"0—2点","primary":false},{"label":"经常2点以后","primary":true}],"multi":false,"prefill":"","tonguePrompt":false,"trace":{"health":"中症","need":"中需求","basis":"月经规律，围绝经期的解释目前缺少关键支持。","next":"确认睡眠时间，验证晚睡和压力是否与夜汗出现同期。"}},{"speaker":"用户","user":"经常2点以后。","agent":"经常凌晨两点后睡，确实可能推动夜汗，但两个月的病程不能只用晚睡解释。最后跟您确认一下，这两个月有没有新加的药或保健品？","options":[{"label":"都没有","primary":true},{"label":"新增处方药","primary":false},{"label":"新增保健品","primary":false},{"label":"记不清","primary":false}],"multi":false,"prefill":"","tonguePrompt":false,"trace":{"health":"中症","need":"中需求","basis":"长期晚睡与工作压力是明确的生活诱因，但不足以排除其他原因。","next":"核对新用药和保健品，排除常见的药物相关夜汗线索。"}},{"speaker":"用户","user":"都没有。","agent":"","options":[],"multi":false,"prefill":"","tonguePrompt":true,"trace":{"health":"中症","need":"中需求","basis":"无药物性夜汗线索；病因仍需门诊基础检查。","next":"触发舌诊；本 Case 走跳过路线。"}}],"summary":[],"leadPrompt":"您可以加我的微信，我会结合三项化验结果和舌象把问诊补齐，明确您属于熬夜耗气还是阴虚内热这一路，再给出可执行的方案，并约好下一次看夜汗次数和入睡时间变化的时间。方案要随反应调整，不建议拿一张固定方长期吃。","followups":["夜汗期间饮食和作息需要注意什么？","夜汗缓解后怎样防止复发？","中医舌诊查看更准确信息"],"report":{"diagnostic":"夜汗约两个月，汗量中等（后背湿、不需更衣），月经规律，无潮热、低热、咳嗽、消瘦、心慌手抖，也没有新增用药，长期凌晨两点后入睡。从这一组表现看，长期熬夜耗气、营卫失和引起的夜汗可能性最大，中医所说的阴虚内热次之；围绝经期基本可以排除——月经仍规律，是最直接的反证。要把前两条分开，需要脉、舌和三项基础化验。","evidence":["病程约2个月；汗量为后背湿、不需更换衣物或床单。每周发生次数尚未核实。","月经规律；无白天潮热、反复低热、持续咳嗽、体重下降、心慌手抖。","无新增处方药或保健品，暂无药物性夜汗线索。","经常凌晨2点以后入睡；卧室温度、被褥厚度尚未核实，这两项是可以立即调整的变量。","本次跳过舌诊，报告不引用舌象，也不据此定阴虚火旺。尚未完成：血常规、甲状腺功能、炎症指标等基础检查。"],"advice":"先按下面的生活建议把入睡时间和卧室环境改掉，记录七天的夜汗次数与程度，这一周通常就能看出晚睡占多大比重。同时把血常规、甲状腺功能、炎症指标这三项查掉，用来排掉感染和甲功异常。拿到化验结果后，您可以添加医生微信，问清楚自己属于\"熬夜耗气\"还是\"阴虚内热\"这一路，以及要不要用药——这两路方药几乎相反，定下方向再用药才安全。这段时间不自行服滋阴止汗类中成药。","tabs":{"处方":"<h3>一、中医辨证</h3>\n<p><strong>暂不立证</strong>；候选方向为\"<strong>阴虚内热</strong>\"与\"<strong>营卫不和、气虚不固</strong>\"，需面诊脉舌后区分。</p>\n<h3>二、辨证分析</h3>\n<p>中医把睡中出汗、醒后汗止称为<strong>盗汗</strong>，传统上多归阴虚内热。但在您身上，阴虚的证据并不充分：汗量不大，没有白天潮热、五心烦热、口干咽燥，月经也还规律。</p>\n<p>另一种同样常见的情形是<strong>长期熬夜耗气、营卫失和</strong>——白天容易疲乏、出汗后怕风、稍动即汗。您连续两个月凌晨两点后入睡，这条线的可能性不低。</p>\n<p>这两条方向的方药几乎相反：一个要滋阴清热（药性偏凉），一个要益气固表（药性偏温）。用错方向不是\"没效\"，而是会让症状更明显——本来偏气虚的人吃了大剂苦寒滋阴药，容易更乏力、胃口更差。所以这一步必须靠面诊的脉、舌、按诊来定，<strong>不能在线上拍板</strong>。这也是本报告不直接给方的原因。</p>\n<h3>三、参考处方方向（面诊讨论用，非可抓处方）</h3>\n<p><strong>本次不开方。</strong>面诊确认证型后，通常在以下两路中选一路：</p>\n<ul><li><strong>若确认阴虚内热｜</strong>当归六黄思路：当归、生地黄、熟地黄、黄芩、黄柏、黄芪。君药取当归、生地黄。方义为滋阴以治本、清热以止汗，佐黄芪固表，防滋阴药过凉。</li>\n<li><strong>若确认营卫不和、气虚不固｜</strong>玉屏风合桂枝汤思路，酌加浮小麦、煅牡蛎。君药取黄芪、白术。方义为益气固表、调和营卫，浮小麦与煅牡蛎收敛止汗。</li>\n<li><strong>两路不可叠加</strong>，也不可\"先吃一路试试\"——试错期间症状变化会干扰后面的判断。</li></ul>\n<h3>四、用药边界</h3>\n<ul><li>以上仅为面诊时的讨论方向，未列剂量、未定加减。</li>\n<li><strong>本例特有风险：</strong>器质性原因尚未排除。在血常规、甲功、炎症指标出来之前，中药<strong>不应作为首选处理</strong>——如果原因是甲状腺功能异常、感染或其他疾病，服药只会掩盖表现、延误诊断。</li>\n<li>不自行购买滋阴止汗类中成药，也不自行服用大剂量补品。</li>\n<li>妊娠可能性、既往用药过敏史尚未核实；地黄、牡蛎等药在部分人群另有注意事项，须面诊核对。</li></ul>\n<p><strong>建议您咨询医生｜</strong>阴虚与气虚这两路方向相反，线上无法拍板。<strong>建议您先完成门诊的基础检查，再点击下方留资卡添加医生企业微信</strong>，把化验结果发给医生，由医生结合脉、舌确定走哪一路。在此之前不建议自行购买中成药。</p>\n\n","生活建议":"<h4>睡眠与卧室环境</h4>\n<p>入睡时间每晚提前 20 分钟，先做到 24 点。卧室通风、温度调偏凉、被褥减薄一层，汗湿之后换干爽衣物。您提到卧室有时偏热，这一条可能立刻见效。</p>\n<h4>白天怎么安排</h4>\n<p>做本人耐受的轻中度活动，睡前留 30 分钟放松时间。不捂汗，也不靠剧烈运动追求大汗，出汗更多只会加重现在的主诉。</p>\n<h4>饮食</h4>\n<p>睡前避免大量夜宵。如有晚间奶茶、浓茶、咖啡或过辣过烫饮食的习惯，先减少。不用大量冰糖、蜂蜜\"进补\"。</p>\n<h4>用药</h4>\n<p>滋阴或止汗类中成药这段时间不要自己买。原因在处方页写了：阴虚和气虚两路方向相反，方向没定就吃，容易把症状搅乱。</p>\n<h4>要记录七天的</h4>\n<p>夜汗次数、汗量、入睡时间，以及月经、体温、体重和用药变化。</p>\n<h4>出现这些情况随时告诉我</h4>\n<p>持续发热、咳嗽、体重下降、心慌，或者汗量突然变大到需要更换睡衣床单。</p>\n","食疗":"<p>以下为两款可轮换的家常食膳，每次选一款即可。材料量按整锅列出；不另加未核对的中药，不把食膳当作治疗处方。</p>\n<h3>百合银耳雪梨羹（家常版）</h3>\n<p><strong>食膳介绍｜</strong>百合、银耳、雪梨的清润食养搭配，做成不额外加糖的小份羹品。用于丰富日常饮食，<strong>不以它治疗夜汗</strong>，也不代替睡眠。</p>\n<p><strong>食材｜</strong>雪梨1个，干银耳15克，清水1000毫升。</p>\n<p><strong>食药两用食材｜</strong>食用百合15克；这份食膳<strong>不加</strong>原配方中的枸杞子。</p>\n<p><strong>辅料｜</strong>不另加冰糖、蜂蜜。</p>\n<p><strong>做法｜</strong>银耳按包装提示泡发，去硬蒂撕小朵，百合洗净。银耳加水煮开后转小火煮约30分钟，加入百合及去核切块的雪梨，续煮约15—20分钟至熟软。</p>\n<p><strong>份量与吃法｜</strong>全量约3—4小份。放温后取一小碗作加餐，每周2—3次；<strong>尽量不在临睡前喝</strong>，避免夜间起夜和腹部饱胀影响睡眠。</p>\n<p><strong>适用与调整｜</strong>适合无明显腹泻、能正常进食的成人。腹泻或食后腹胀时暂停；控糖者将梨计入水果份量，不因\"不加糖\"而不限量。</p>\n<h3>莲子百合瘦肉汤（家常版）</h3>\n<p><strong>食膳介绍｜</strong>沿用莲子、百合配瘦肉的清淡食膳结构，可作为晚餐的一道汤菜，兼顾普通食材与蛋白质摄入。</p>\n<p><strong>食材｜</strong>瘦肉250克，清水1200毫升。</p>\n<p><strong>食药两用食材｜</strong>莲子20克、食用百合15克；这份食膳<strong>不加</strong>原配方中的麦冬。</p>\n<p><strong>辅料｜</strong>食盐少许。</p>\n<p><strong>做法｜</strong>莲子洗净去芯后浸泡，百合洗净。瘦肉切小块焯水，与莲子加水煮开，转小火炖约40分钟；放入百合再炖约15分钟至软熟，少盐调味。</p>\n<p><strong>份量与吃法｜</strong>全量约2—3人份。晚餐取一小碗，配蔬菜及适量主食；尽量在临睡前2—3小时完成晚餐，不在睡前喝一大碗汤。</p>\n<p><strong>适用与调整｜</strong>适合希望清淡食养、能正常进食者。汤中的肉也要吃，莲子计入主食；腹胀明显者少量尝试。夜汗持续仍需评估原因；食物过敏及特殊饮食要求尚未核实，先自行核对再选用。</p>\n\n","穴位":"<p>穴位可作为睡前放松的辅助，<strong>不承诺止汗</strong>，也不能用按揉后的感觉来判定是否阴虚。</p>\n<h3>神门</h3>\n<p><strong>位置／范围｜</strong>腕掌侧横纹靠小指的一端，尺侧腕屈肌腱桡侧的凹陷处。</p>\n<p><strong>选用理由／判断｜</strong>传统用于宁心安神，适合在压力大、入睡晚时配合安静放松——这正是目前最需要改的一环。</p>\n<p><strong>操作／安排｜</strong>指腹轻揉30—60秒，左右各一次，放在睡前的放松流程里；不按到局部疼痛。</p>\n<h3>内关</h3>\n<p><strong>位置／范围｜</strong>腕掌侧横纹上约三横指，两条肌腱之间。</p>\n<p><strong>选用理由／判断｜</strong>传统用于宁心和胃；本次用于放松，不替代夜汗的病因评估。</p>\n<p><strong>操作／安排｜</strong>舒适坐位，配合自然呼吸轻揉约30秒；出现麻刺不适就停。</p>\n<p><strong>使用边界｜</strong>本次未核实妊娠可能性，因此<strong>不安排三阴交等需要额外核对的穴位</strong>；不自行针刺，不艾灸到发汗（出汗更多会加重当前主诉）。皮肤破损或红肿处不按。</p>\n<p>以上为在线初步建议，非处方。</p>\n\n"},"defaultTab":"处方","trace":null},"resultType":"report","tongueAction":"skip","tongueAgent":"没有新增用药，范围就更窄了。舌象能帮我看是偏阴虚内热还是偏气虚不固，这决定调理走哪一路。夜汗的病因还要靠检查来定，所以现在不方便拍也不影响，可以跳过。","tongueFeedback":"","tongueTrace":{"health":"中症","need":"中需求","basis":"本次跳过舌诊；已有信息足以给出阶段计划与复评标准。","next":"现有信息足以形成阶段判断，生成包含待排查方向和执行计划的详细报告。"},"tongueReport":null,"doctorCard":{"facts":"40岁女性，夜汗约2个月，主要后背湿、不需要换衣服；近期工作压力较大；无白天潮热、反复低热、持续咳嗽、体重明显下降和心慌手抖；月经规律；经常凌晨2点以后入睡；近两个月无新增处方药或保健品；本次跳过舌诊。","intent":"希望系统查明夜汗原因，不想被简单归为更年期或直接用药，属于中需求。","strategy":"先用完整报告解释已知依据和待排查方向；私域由医生补一个关键缺口并判断先检查、先非药物调整还是进入中医处方，本次报告不引用未完成舌象。","opening":"您的情况我看过了：夜汗约两个月，后背湿但不用换衣服；月经规律，没有潮热、低热、咳嗽、消瘦和心慌手抖；近期压力大、经常凌晨两点后睡，也没有新增药物。\n\n先说结论：从这一组表现看，长期熬夜耗气引起的夜汗可能性最大，中医所说的阴虚内热次之；围绝经期基本可以排除，因为您月经仍规律。这两条要分开，得靠脉、舌加三项化验。\n\n所以麻烦您去查三项：血常规、甲状腺功能、炎症指标，用来排掉感染和甲功异常。结果出来直接发我，我会对着数值告诉您每一项说明什么，并定下按哪一路调。\n\n这几天先把入睡时间每晚提前 20 分钟、卧室调偏凉、被子减薄一层。麻烦您每天早上发我两句：昨晚几点睡、出汗到什么程度（后背湿／需要换睡衣／床单也湿）。在化验出来之前，滋阴止汗的中成药先不要买。"}},{"id":"case6","number":6,"title":"膝软骨磨损影响上下楼","health":"中症","need":"重需求","route":"加速治疗排序","meta":{"原始问题":"膝盖软骨磨损能用中药吗？上下楼很疼，想赶紧治。"},"rounds":[{"speaker":"用户","user":"膝盖软骨磨损能用中药吗？上下楼很疼，我想赶紧治，需要吃药也可以。","agent":"先说最重要的一句，中药可以参与膝痛处理，但没有任何药能让磨掉的软骨长回来。我先跟您确认一下当下的状态，您现在是否有以下情况？（可多选）","options":[{"label":"突然红肿发热","primary":false},{"label":"完全不能落地","primary":false},{"label":"关节卡住伸不直","primary":false},{"label":"都没有","primary":true}],"multi":true,"prefill":"","tonguePrompt":false,"trace":{"health":"中症","need":"重需求","basis":"自述结构性问题并影响上下楼；用户明确要求快速治疗。","next":"先把\"中药能不能修复软骨\"的边界说清，再排掉急性异常。"}},{"speaker":"用户","user":"都没有。","agent":"都没有，说明不是急性关节问题，可以按慢性退变的节奏来安排。膝痛持续多久了？","options":[{"label":"不到1个月","primary":false},{"label":"1—3个月","primary":false},{"label":"约半年","primary":true},{"label":"一年以上","primary":false}],"multi":false,"prefill":"","tonguePrompt":false,"trace":{"health":"中症","need":"重需求","basis":"无需立即处理的急性关节异常。","next":"确认病程，决定先止痛还是先做功能训练。"}},{"speaker":"用户","user":"约半年。","agent":"半年，属于慢性期。止痛只是让您能开始练，真正决定长期结果的是肌力和活动方式。疼主要在膝盖哪一片？","options":[{"label":"髌骨前方","primary":true},{"label":"膝盖内侧","primary":false},{"label":"膝盖外侧","primary":false},{"label":"说不清","primary":false}],"multi":false,"prefill":"","tonguePrompt":false,"trace":{"health":"中症","need":"重需求","basis":"半年属慢性期，止痛只是手段，肌力与活动方式决定长期结果。","next":"确认疼痛位置，对应不同结构。"}},{"speaker":"用户","user":"髌骨前方。","agent":"髌骨前方、上下楼明显，多与髌股关节负荷有关。除了上下楼，您平地走和从椅子上起身怎么样？","options":[{"label":"平地走没问题，起身有点疼","primary":true},{"label":"平地走一段也疼","primary":false},{"label":"起身必须用手撑","primary":false},{"label":"走十几分钟就要歇","primary":false}],"multi":false,"prefill":"","tonguePrompt":false,"trace":{"health":"中症","need":"重需求","basis":"髌骨前方疼与上下楼明显，是典型的屈伸负荷相关组合。","next":"确认平地行走和起身时的功能受限程度，用于安排活动量与治疗优先级。"}},{"speaker":"用户","user":"平地走没问题，起身有点疼。","agent":"平地能走、起身有点疼，说明主要是屈伸负荷相关。止痛药和部分中药都伤胃，您有胃炎或胃溃疡吗？","options":[{"label":"有胃炎","primary":true},{"label":"有胃溃疡","primary":false},{"label":"没有胃病史","primary":false},{"label":"不确定","primary":false}],"multi":false,"prefill":"","tonguePrompt":false,"trace":{"health":"中症","need":"重需求","basis":"平地行走保留、起身轻度疼痛，暂不属于持续性静息痛或严重功能受限。","next":"确认胃病史，因为它会直接改变止痛药和部分中药的选择。"}},{"speaker":"用户","user":"有胃炎。","agent":"有胃炎，这条会直接影响止痛药和中药的选择。您目前有长期服用的药吗？（可多选）","options":[{"label":"长期服止痛药","primary":false},{"label":"长期服抗凝药","primary":false},{"label":"其他长期用药","primary":false},{"label":"没有长期用药","primary":true}],"multi":true,"prefill":"","tonguePrompt":false,"trace":{"health":"中症","need":"重需求","basis":"已确认胃炎，不能为了追求快速止痛而忽略胃肠风险。","next":"核对长期用药，排除叠加止痛或抗凝相关风险。"}},{"speaker":"用户","user":"没有长期用药。","agent":"","options":[],"multi":false,"prefill":"","tonguePrompt":true,"trace":{"health":"中症","need":"重需求","basis":"有胃炎但无长期用药；当前可先围绕功能、影像和胃部风险排列治疗顺序。","next":"已有信息足以进入舌诊补充环节；舌象不替代膝关节查体和影像。"}}],"summary":[],"leadPrompt":"您可以加我的微信，把膝关节的影像报告和直腿抬高的完成情况发我，我会结合您的胃炎定下训练强度、要不要用药、外治能不能上，并约好下一次看上下楼疼痛变化的时间。这个顺序需要随功能变化调整。","followups":["上下楼时膝盖需要注意什么？","膝痛缓解后怎样防止反复？","中医舌诊查看更准确信息"],"report":{"diagnostic":"髌骨前方疼、上下楼明显，反复约半年；平地行走无明显疼痛、起身轻度疼痛，无红肿发热、卡锁、不能负重。用户自述\"软骨磨损\"，但是否做过影像检查、报告结论如何均尚未核实，该说法目前只能视为用户转述。中医可归入膝痹，多见肝肾不足兼局部气血瘀滞，寒热虚实需面诊辨别。合并胃炎，止痛药与部分中药的选择需据此调整。任何食膳、按穴、中药都不能修复已磨损的软骨。","evidence":["反复约半年，主要髌骨前方，上下楼明显。","平地行走无明显疼痛，从椅子上起身时轻度疼痛，属屈伸负荷相关，不是持续性静息痛；可保留平地活动量。","无突然红肿发热、关节卡锁、完全不能负重，暂无需急诊处理的表现。","有胃炎；未长期服止痛药或抗凝药。","尚未核实：是否做过膝关节X光或核磁、报告结论、晨僵时长、肾功能、药物过敏史、既往康复训练史。\"软骨磨损\"目前仅为用户转述，需影像报告确认。","本次跳过舌诊，报告不引用舌象。"],"advice":"顺序是：先做骨科或康复科评估（若已有膝关节影像及报告请一并带上，并主动说明胃炎），确定股四头肌与髋外侧肌力训练方案及合适活动量；同期减少反复爬楼、深蹲、跪地、负重起身，保留不加痛的平地活动；止痛方案由医生结合胃炎风险决定。不自行叠加止痛药、活血中药和多种膏药。","tabs":{"处方":"<h3>一、中医辨证</h3>\n<p>倾向\"<strong>膝痹——肝肾不足，兼局部气血瘀滞</strong>\"；寒热偏向未定，须面诊确认。</p>\n<h3>二、辨证分析</h3>\n<p>病程半年以上、活动后加重、上下楼明显，中医多归于筋骨失养的膝痹：肝主筋、肾主骨，中年以后筋骨得养不足，局部又长期承受偏大的负荷，气血运行不畅，就出现固定位置的疼痛——这与您\"髌骨前方、上下楼才疼、平地走没问题\"的表现是对得上的。</p>\n<p>您没有红肿发热，暂不属湿热。这一点排掉之后，剩下要分的是<strong>偏寒还是偏虚为主</strong>：遇冷加重、得温则舒的偏寒，需要温通；以酸软无力为主的偏虚，需要补养。这一步直接决定用不用温通药，而它靠问诊问不出来，要靠面诊的舌、脉和局部触诊。</p>\n<p>还有一层更重要：您的核心问题是<strong>负荷与肌力不匹配</strong>。中药能改善疼痛和局部气血，但替代不了股四头肌力量。如果只吃药不改活动方式，疼痛会反复，而且会误以为\"药没用\"。</p>\n<h3>三、参考处方方向（面诊讨论用，非可抓处方）</h3>\n<p><strong>本次不开方。</strong>若面诊确认肝肾不足兼瘀，通常在<strong>独活寄生思路</strong>上讨论：</p>\n<ul><li><strong>组成方向｜</strong>独活、桑寄生、杜仲、牛膝、当归、白芍、川芎、地黄、党参、茯苓、甘草。</li>\n<li><strong>君药｜</strong>独活、桑寄生、杜仲。</li>\n<li><strong>方义｜</strong>补肝肾、养气血为本，兼以祛风通络止痛；标本同治，适合慢性、以酸痛为主的膝痹。若局部瘀象明显（固定刺痛、夜间加重），可酌加丹参、鸡血藤。</li>\n<li><strong>外治｜</strong>中药外敷、艾灸可与专业人员讨论，但同样<strong>不替代肌力训练</strong>。</li></ul>\n<h3>四、用药边界</h3>\n<ul><li>以上不是可以照抓的处方，未列剂量、未定加减，也未确定寒热偏向。</li>\n<li><strong>本例特有风险：</strong>您有胃炎。独活寄生汤类方中多味药性偏温燥，且临床常与非甾体止痛药同期使用，<strong>胃部风险必须由医师评估</strong>；牛膝等药在妊娠、出血倾向及抗凝治疗时另有禁忌。</li>\n<li>建议您以影像报告和面诊查体为基础，由医师决定是否用药、走哪一路。<strong>中药与止痛药不要自行叠加</strong>，膏药也不要多种同时贴。</li>\n<li>本页不承诺疗程与见效时间，也不承诺软骨修复。</li></ul>\n<p><strong>建议您咨询医生｜</strong>您有胃炎，中药与止痛药的组合需要专业评估出血与溃疡风险。<strong>建议您点击下方留资卡添加医生企业微信</strong>，若此前拍过膝关节影像，把报告一并发给医生，由医生面诊后确定寒热偏向、是否用药、以及外治能不能上；同时请把胃炎史告知骨科或康复科医生。</p>\n\n","生活建议":"<h4>上下楼与起身</h4>\n<p>上下楼扶扶手、一步一台阶，<strong>上楼好腿先上、下楼好腿先下</strong>。日常起身借助扶手、选较高稳固的座椅，穿合脚防滑鞋。这几个动作细节能立刻减轻髌骨前方的负荷。</p>\n<h4>活动量</h4>\n<p>减少反复爬楼、深蹲、跪地和负重起身，但不要完全不动，保留不加痛的平地活动。不要照短视频做大量深蹲、负重弓步或所谓\"练软骨\"。</p>\n<h4>用药</h4>\n<p>不自行叠加止痛药、活血中药和多种膏药。\"中药\"\"外用\"不等于安全，您有胃炎，这一点尤其重要。</p>\n<h4>要记录的</h4>\n<p>上下楼、步行后的疼痛变化。活动后持续加痛或者次日明显加重，说明当天负荷超了，下次减量。</p>\n<h4>出现这些情况随时告诉我</h4>\n<p>新出现明显肿热、发热、关节卡锁或者不能落地。这几项一出现先停掉按揉和训练。</p>\n","食疗":"<p>以下为两款可轮换的家常食膳，每次选一款即可。它们的作用是保证日常饮食质量，<strong>不承担修复软骨的治疗作用</strong>。</p>\n<h3>山药莲子瘦肉汤</h3>\n<p><strong>食膳介绍｜</strong>沿用山药、莲子健脾和中的传统食养搭配，配瘦肉作正餐汤菜，提供普通食材与蛋白质。</p>\n<p><strong>食材｜</strong>瘦肉250克，生菜心适量，清水1200毫升。</p>\n<p><strong>食药两用食材｜</strong>干山药25克、莲子20克、大枣3枚；不另加补气药材。</p>\n<p><strong>辅料｜</strong>食盐少许。</p>\n<p><strong>做法｜</strong>莲子洗净去芯后浸泡；山药洗净，大枣去核。瘦肉切块焯水，与山药、莲子、大枣加水煮开，转小火炖约45—60分钟；加生菜心煮熟，少盐调味。</p>\n<p><strong>份量与吃法｜</strong>全量约2—3人份。每次取一小碗，连肉和山药一起吃；不靠多喝汤代替一餐。<strong>膝关节问题需要维持肌肉量，蛋白质要吃够，不要只喝汤。</strong></p>\n<p><strong>适用与调整｜</strong>适合能正常进食、无相关食物过敏者。山药、莲子计入主食，肉类计入蛋白质食物；有胃炎者温热食用，不空腹大量喝汤。</p>\n<h3>山药冬瓜汤（家常版）</h3>\n<p><strong>食膳介绍｜</strong>沿用山药配冬瓜的清淡汤膳搭配，作为一餐中的蔬菜汤。它不是利尿剂，也不能消除关节积液或\"疏通血管\"。</p>\n<p><strong>食材｜</strong>冬瓜300克，清水1200毫升。</p>\n<p><strong>食药两用食材｜</strong>干山药20克；这份食膳<strong>不加</strong>薏苡仁。</p>\n<p><strong>辅料｜</strong>食盐少许；<strong>不放</strong>原配方的虾皮，减少额外盐分。</p>\n<p><strong>做法｜</strong>干山药洗净加水煮约20分钟；冬瓜去皮去瓤切块，加入后再煮约15分钟至熟软，少盐调味。</p>\n<p><strong>份量与吃法｜</strong>全量约2—3人份。正餐取一小碗，同时吃冬瓜和山药，另配瘦肉、蛋或豆制品；不因喝汤而减少蛋白质摄入。</p>\n<p><strong>适用与调整｜</strong>适合已获准普通饮食、无相关过敏者。若有医生规定的饮水或肾病饮食限制，先按个体医嘱调整。</p>\n<p>以上为在线初步建议，非处方。</p>\n\n","穴位":"<p>您当前的主要问题是膝前方负重疼。按穴最多是舒适放松的辅助，核心仍是合适的活动量和康复训练。以下不安排针刺，<strong>不重压髌骨周围的痛点</strong>。</p>\n<h3>足三里</h3>\n<p><strong>位置／范围｜</strong>外膝眼下约四横指，胫骨前缘外侧约一横指处。</p>\n<p><strong>选用理由／判断｜</strong>传统用于调养脾胃与下肢不适；这里特意选<strong>远离髌骨痛点</strong>的位置作轻柔放松，不宣称修复软骨。</p>\n<p><strong>操作／安排｜</strong>坐稳、膝关节放松，指腹轻揉30—60秒；若牵出原来的膝痛就停止。</p>\n<h3>阳陵泉</h3>\n<p><strong>位置／范围｜</strong>小腿外侧，腓骨小头前下方的凹陷处。</p>\n<p><strong>选用理由／判断｜</strong>传统用于舒筋；本次作为了解的穴位，建议由专业人员确认位置后再轻揉。</p>\n<p><strong>操作／安排｜</strong>轻触或轻揉约30秒，<strong>不朝腓骨颈后方深压</strong>；出现向小腿、足背放射的麻电感立即停止。</p>\n<p><strong>使用边界｜</strong>不自行针刺、强力推拿或在痛点反复按压。红肿发热、皮损、明显麻木区域不按；出现新的肿胀、卡锁或不能负重先就医。</p>\n<h3>比按穴更该做的事</h3>\n<p>坐位<strong>直腿抬高</strong>：坐稳，一条腿伸直缓慢抬起、停2秒、放下，一天3组、每组10次，两侧交替，<strong>以不加痛为准</strong>。这是本例真正决定长期结果的动作，具体次数建议由康复科按您的实际肌力调整。</p>\n\n"},"defaultTab":"处方","trace":null},"resultType":"report","tongueAction":"skip","tongueAgent":"有胃炎这条我记下了，它会直接改变止痛药的选择，也是不建议您自己先吃药的原因。膝关节判断主要靠查体、功能和影像，舌象只作补充，现在不方便拍可以跳过。","tongueFeedback":"","tongueTrace":{"health":"中症","need":"重需求","basis":"本次跳过舌诊；关节治疗仍以症状、功能、查体和影像为依据。","next":"现有功能与安全信息足以排列治疗顺序，生成详细报告并明确后续资料核对。"},"tongueReport":null,"doctorCard":{"facts":"自述膝软骨磨损；髌骨前方疼约半年，上下楼明显，平地行走没问题、从椅子起身有点疼；无突然红肿发热、完全不能落地或关节卡住伸不直；有胃炎，无长期用药；本次跳过舌诊；既往影像情况尚未核实。","intent":"希望尽快治疗，接受必要用药；核心是明确训练、外治和用药顺序，属于重需求。","strategy":"快速承接并先回答是否需要尽快治疗；让用户发送既往影像和用药资料，结合胃炎风险明确今天、近几天及复评节点，不承诺软骨再生、不迎合立即开药。","opening":"您的情况我看过了：髌骨前方疼约半年，上下楼明显，平地能走、起身有点疼；没有红肿发热、卡住或不能落地；同时有胃炎，没有长期用药。\n\n您想赶紧治，我把最快的顺序给您。这类膝前疼真正决定长期结果的是股四头肌力量和活动方式，止痛只是让您能开始练，所以第一步不是吃药，顺序错了反而来回耽误时间。\n\n这周先做两件事：把爬楼锻炼、深蹲和跪地停掉，上下楼扶扶手、一步一台阶、下楼好腿先下；坐着做直腿抬高，一天 3 组、每组 10 次，以不加痛为准。麻烦您每天练完发我一句：今天做了几组、上下楼疼痛 0—10 分打几分。\n\n另外想确认一下，膝盖此前拍过 X 光或核磁吗？拍过就把报告和片子发我，我看分级和髌股关节情况；没拍过的话麻烦去拍一张负重位膝关节 X 光，这个我需要，看完才能定训练强度和用不用药。您的胃炎我已经记下了，后面无论开方还是用止痛药，我都会避开伤胃的品种。"}},{"id":"case7","number":7,"title":"梨水治咳嗽","health":"重症","need":"轻需求","route":"停止调理去就医","meta":{"原始问题":"红梨加什么煮水治咳嗽？"},"rounds":[{"speaker":"用户","user":"红梨加什么煮水治咳嗽？","agent":"梨水能润喉、补点水分，缓解咽干有用，但处理不了咳嗽的原因。痰的颜色最能提示方向，您现在更接近哪种？","options":[{"label":"干咳，痰少","primary":false},{"label":"白痰","primary":false},{"label":"黄痰","primary":true},{"label":"说不清","primary":false}],"multi":false,"prefill":"","tonguePrompt":false,"trace":{"health":"轻症","need":"轻需求","basis":"只询问家庭食疗，尚未提供重症信息。","next":"先直接回答梨水的做法与边界，再问痰的性质。"}},{"speaker":"用户","user":"黄痰。","agent":"黄痰提示可能有感染参与，已经超出梨水能覆盖的范围。急性起病和拖久的处理完全不同，您咳嗽多久了？","options":[{"label":"3天以内","primary":true},{"label":"4—7天","primary":false},{"label":"1—3周","primary":false},{"label":"3周以上","primary":false}],"multi":false,"prefill":"","tonguePrompt":false,"trace":{"health":"中症","need":"轻需求","basis":"黄痰提示可能有感染参与，需结合病程与全身表现。","next":"确认病程。"}},{"speaker":"用户","user":"3天以内。","agent":"三天以内、黄痰，是急性起病。这种情况体温最关键。麻烦您现在测一下，告诉我具体数值。","options":[{"label":"低于37.3℃","primary":false},{"label":"37.3—38℃","primary":false},{"label":"38—39℃","primary":false},{"label":"39℃以上","primary":true}],"multi":false,"prefill":"","tonguePrompt":false,"trace":{"health":"中症","need":"轻需求","basis":"三天内起病＋黄痰，急性过程。","next":"要求实测体温，这是本例最关键的客观指标。"}},{"speaker":"用户","user":"39℃以上。","agent":"39℃以上，这个体温加上黄痰，还有几个和肺部相关的表现要确认。您现在是否有以下情况？（可多选）","options":[{"label":"上楼就喘","primary":true},{"label":"胸口疼","primary":true},{"label":"痰中带血","primary":true},{"label":"都没有","primary":false}],"multi":true,"prefill":"","tonguePrompt":false,"trace":{"health":"中症","need":"轻需求","basis":"高热＋黄痰，需立即筛查肺部相关危险表现。","next":"集中筛查活动后气短、胸痛和痰血；一旦命中即转入急救处置。"}},{"speaker":"用户","user":"上楼会喘、胸口疼、痰中带血。","agent":"","options":[],"multi":false,"prefill":"","tonguePrompt":false,"trace":{"health":"重症","need":"轻需求","basis" const STRATEGIES=[{"number":1,"title":"轻症 × 轻需求","verdict":"无警讯，低成本诉求","agent":"简明解决卡，不延伸","private":"低频复评，事件触发","criteria":"风险较低，无危险表现；用户希望通过饮食、作息、运动等低成本方式解决。","agentStrategy":"先回答当前问题，只问足以判断安全和适用性的必要信息（3 轮左右）。形态①：小结＋留资卡——小结写清当前怎么看、具体怎么做、观察多久、什么情况停止自我处理。不为了转化强行延伸舌诊、体质或开方问诊，不出详细报告。","handoff":"用户愿意保留日常健康咨询入口，或希望后续有人帮助复评时进入。同步：原问题、已排除的异常表现、已给建议、观察期限、升级条件。","firstAction":"说明已看过前文，不要求用户重新描述。首个任务是执行一项简单调整，并在约定时间反馈\"变轻、没变还是加重\"。","sop":"低频、事件触发：到期做一次复评，平时以食养作息答疑维持关系，每次只解决一个具体问题。明显改善即结束医疗跟踪；到期无改善或出现新症状升级为中症路径。不主动推处方、疗程和高频付费服务。"},{"number":2,"title":"轻症 × 中需求","verdict":"无警讯，要完整方案","agent":"先判必要性，再给方案","private":"核对产品与现用药","criteria":"风险较低，但希望获得相对完整的食疗、产品或调理方案，愿意做个体化了解。","agentStrategy":"确认轻症和基本安全后，了解目标、现用药、基础病及产品信息（5 轮内）。形态②：详细报告＋留资卡，导航栏【处方】【生活建议】【食疗】【穴位】、默认处方页。处方页先回答\"有没有必要用\"，再谈\"能不能用、怎么用\"，并以【建议您咨询医生】收尾。","handoff":"方案涉及具体产品、药食同源材料、现用药核对或需要个体化调整时承接。同步：产品照片或配料、用户目标、现用药、已知禁忌、Agent 初步建议。","firstAction":"真人先核对真实产品、配料和现用药，优先判断\"有没有必要用\"。首条消息只补一个关键缺口。","sop":"给出三类明确结果之一：可以短期尝试／暂不建议／补充检查后再判断。可尝试则约定 3—7 天观察指标与停止条件，到期决定继续、调整或停止。无效或不耐受即停止，不机械推荐替代产品；轻症信息不足时不设计长期疗程，不因用户接受付费就强行开方。"},{"number":3,"title":"轻症 × 重需求","verdict":"客观轻，主观焦虑高","agent":"风险复核＋观察时间表","private":"面诊复核，不开安慰药","criteria":"客观问题较轻，但用户焦虑、反复确认或强烈要求吃药治疗。","agentStrategy":"先完成风险复核，明确告知目前是否需要检查、治疗或用药；识别重需求来源（症状不适／既往经历／疾病恐惧／\"吃药才安心\"）。形态②：详细报告＋留资卡，默认处方页，用\"辨证分析\"解释为什么此刻用药方向可能相反。交付安心与观察方案，不迎合直接推荐药物。","handoff":"用户仍持续担心、反复咨询，或需要真人面诊完成风险确认时承接。同步：客观轻症依据、用户最担心的问题、已解释过的内容、焦虑来源。","firstAction":"真人先复述当前低风险依据，再直接回应用户最担心的那个结果。必要时安排一次面诊或合理检查完成复核，而不是反复在线安慰。","sop":"给出明确时间表：现在不用做什么、观察到什么时候、出现什么变化需要升级；短期主动复评一次，避免用户到处重复问诊。不开\"安慰药\"、不做无指征检查、不利用焦虑推高客单。出现新的客观异常按症状程度升级；焦虑长期影响生活则建议相应专业支持。"},{"number":4,"title":"中症 × 轻需求","verdict":"持续反复，偏不吃药","agent":"低成本方案＋复评","private":"先查执行，不急开方","criteria":"问题持续或反复（如病程超过评估阈值），但用户倾向不吃药、少花钱、先做生活调理。","agentStrategy":"收集足以判断病程、趋势、功能影响和必要检查的信息（4 轮左右）。形态②：详细报告＋留资卡，导航栏【生活建议】【食疗】【穴位】、默认生活建议——轻需求不出处方页。尊重不吃药偏好，但必须给出最低检查门槛与复评标准，不能把中症回答成泛化养生。","handoff":"可先进入私域执行阶段方案，也可到期无改善后再由真人介入。同步：阶段判断、不吃药偏好、已给方案、复评时间、必须检查的条件。","firstAction":"真人不急于开方，先确认生活调理是否执行正确。首次只补一个会改变去向的信息，例如症状趋势、功能变化或一项基础检查。","sop":"设明确复评节点，跟踪症状频次、程度、功能和方案完成度。改善则继续低成本方案；无改善时解释最低必要检查及其目的，再由用户决定是否进入进一步诊疗。不能因为用户暂时不愿付费就省略安全提醒和检查门槛。到期无改善、反复加重或影响功能时升级为中症中／重需求路径。"},{"number":5,"title":"中症 × 中需求","verdict":"需完整辨证，接受付费","agent":"阶段判断＋舌诊说明","private":"核心诊疗，面诊定向","criteria":"希望获得完整调理方案，接受必要检查、真人服务和合理付费。九宫格中的核心真人诊疗路径。","agentStrategy":"完成较完整问询（5 轮内），形成阶段判断：已知事实、判断依据、尚待排查、可先执行的方案、复评标准。触发舌诊时必须解释舌象能帮医生判断什么，不机械索图。形态②：详细报告＋留资卡，默认处方页；证据不足时写\"暂不立证＋两个候选方向\"，并说明用错方向的后果。","handoff":"Agent 完成报告后直接承接。同步：完整接诊卡、检查资料、用药、Agent 判断、待确认项、用户目标。","firstAction":"真人阅读前文后，补充体格检查、必要舌脉或检查解读，形成明确决策：先检查、先非药物调整，还是进入中医处方。","sop":"若进入处方，必须说明配伍思路、服用方法、注意事项和阶段目标。早期复评耐受，中期复评症状与功能，之后按真实变化维持、调整、停方或转诊。续方必须建立在真实改善和继续治疗必要性上；无效、不耐受或出现新风险时调整方案、补充检查或转诊，不用固定脚本促复购。"},{"number":6,"title":"中症 × 重需求","verdict":"影响生活，要求尽快","agent":"治疗顺序＋时间表","private":"快速面诊，安全缓解","criteria":"症状明显、影响生活，或既往处理失败，希望尽快治疗。","agentStrategy":"首轮即回应\"是否需要尽快处理\"并快速确认有无急性风险（第 1 轮就做危险表现筛查）。交付明确的治疗顺序与时间表：现在能做什么、近期要完成什么、真人医生负责什么。形态②：详细报告＋留资卡，默认处方页。不迎合\"马上吃药\"直接给处方，并说明为什么\"先评估再用药\"其实更快。","handoff":"快速转入真人医生，尽量缩短等待。同步：功能影响、症状程度、既往治疗、用药安全信息、用户最希望解决的问题。","firstAction":"真人先回答\"是否需要尽快检查或治疗\"，明确今天、近几天和复评节点；随后核对影响治疗安全的基础病、药物和已有检查。","sop":"快速安排视频或线下面诊，先处理可安全缓解的症状，同时完成病因与功能评估；用清晰时间表管理预期。加速服务不等于保证立即开药、快速治愈或使用更多药物。出现危险表现立即升级重症；症状稳定、焦虑下降后转入中症中需求的常规复评路径。"},{"number":7,"title":"重症 × 轻需求","verdict":"有警讯，却只想食疗","agent":"停止调理，给就医指令","private":"只推动就医落地","criteria":"存在危险表现，但用户只想食疗、观察，或因费用、交通等原因不愿就医。","agentStrategy":"命中警讯即立即停止常规问询和一切中医调理建议，明确指出哪些表现使家庭观察不安全。形态①：小结＋留资卡，小结第一句就是就医指令，随后写路上禁忌、到院说的一句话原文、要带什么、后续以谁为准。无\"紧急行动卡\"，不出详细报告、不做舌诊、无服务胶囊。","handoff":"不以添加医生为就医前提。Agent 先推动联系家人、急救或医院；私域只用于协助落实行动。同步：危险表现、出现时间、当前地点、陪同与出发条件。","firstAction":"问诊卡首条消息按重症五段结构：先明确必须马上去医院＋原因 → 直接问\"您已经去医院了吗\" → 分\"还没去／已到院\"给动作 → 已到院则把检查报告和用药单发来，由医生解读并制定后期计划 → 一条禁止项。","sop":"围绕行动节点跟踪：是否有人陪同、是否出发、是否到院、是否完成分诊；针对费用、交通、无人陪同等阻力找最低风险的现实办法。急性期禁止推荐代茶饮、中药、按摩、针灸或付费调理服务。完成到院交接后暂停线上判断，病情稳定后重新评估恢复期需求。"},{"number":8,"title":"重症 × 中需求","verdict":"有警讯，愿意就医","agent":"急诊路径＋到院表达","private":"确认路径，不替代急诊","criteria":"存在危险表现，用户愿意接受医生和检查，但可能误以为企业微信可以直接处理。","agentStrategy":"明确告知线上不能替代现场诊疗，直接给出急诊、专科急诊或急救路径；交代需要携带的资料、现用药和到院后要说明的关键信息。形态①：小结＋留资卡，2 轮内结束问询，命中警讯不再确认\"是否有人陪送\"。","handoff":"Agent 完成紧急指引后同步真人，真人不重复询问完整病史。交接重点：出发状态、症状开始时间、药物、已有检查。","firstAction":"确认用户选择了正确的线下路径，并帮助整理到院表达；不让用户停留在企微等待线上诊断或处方。按重症五段结构先问\"您已经去医院了吗\"。","sop":"跟踪出发、到院、关键检查和现场医嘱；稳定后协助解读检查结果、整理用药、安排恢复期随访。不能在线先试药再观察，不能用私域服务替代急诊。急性阶段结束后按诊断重新判断症状程度与需求强度。"},{"number":9,"title":"重症 × 重需求","verdict":"有警讯，高度焦虑","agent":"短句稳定＋立即行动","private":"只确认急救进度","criteria":"存在危险表现，用户高度焦虑，强烈要求马上治疗或先吃药。","agentStrategy":"用短句稳定情绪，迅速指出当前最重要的行动；停止长问询，不讨论体质、舌象和调理；明确不要自行吃药、加药或继续刺激性操作（并说明\"吃了会限制到院后能用的治疗\"）。形态①：小结＋留资卡，2 轮内结束，小结中要求家属记住\"最后一次完全正常的时间\"。","handoff":"立即进入急救协同。用户是否添加医生、是否付费均不影响急救指引。同步：核心危险表现、症状时间、用户情绪状态、急救进度。","firstAction":"先问\"120 叫了吗、人在路上还是已到院\"；用户正在执行急救时减少消息，避免干扰。已到院则请其发来 CT／核磁报告与用药清单。","sop":"按\"急救接通—陪同到位—到院\"节点跟踪；到院后以现场医生处理为准，家属需要时协助整理检查和医嘱。未明确诊断前不远程开药，不建议按摩、针灸或自行加减药；也不对\"针灸与发病是否相关\"这类因果问题下结论。生命状态稳定后再重新建立康复和中医恢复期方案。"}];

const state={caseIndex:0,round:0,stage:'dialogue',reportTab:null,reportScroll:{},organTab:'心肺',lead:false,stable:false,tongueFlow:false,tongueSkipped:false,skipOverride:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s).replace(/[。；，、,;\s]/g,'').trim();
function caseData(){return CASES[state.caseIndex]}
function reset(){state.round=0;state.stage='dialogue';state.reportTab=null;state.reportScroll={};state.organTab='心肺';state.lead=false;state.stable=false;state.tongueFlow=false;state.tongueSkipped=false;state.skipOverride=null;if($('composer'))$('composer').value='';render()}
function selectCase(i){state.caseIndex=i;document.querySelectorAll('.case-cell').forEach((b,j)=>b.classList.toggle('active',i===j));reset()}
function buildGrids(){
 const labels=['轻症','中症','重症'];let h='<div></div>'+labels.map(x=>'<div class="axis">'+x+'</div>').join('');
 ['轻需求','中需求','重需求'].forEach((need,r)=>{h+='<div class="axis side">'+need+'</div>';[0,1,2].forEach(c=>{const item=CASES[c*3+r],i=CASES.indexOf(item);h+='<button class="case-cell" data-index="'+i+'"><em>0'+item.number+'</em><b>'+esc(item.title)+'</b><span>'+esc(item.route)+'</span></button>'})});$('caseGrid').innerHTML=h;
 document.querySelectorAll('.case-cell').forEach(b=>b.onclick=()=>selectCase(Number(b.dataset.index)));
 $('ruleGrid').innerHTML=CASES.map(c=>'<div class="rule-cell"><b>'+c.health+' × '+c.need+'</b>'+esc(c.title)+'<br><span>'+esc(c.route)+'</span></div>').join('');
}
function message(role,content,speaker='用户'){return role==='user'?'<div class="msg user">'+esc(content)+'</div><div class="read">已读</div>':'<div class="msg agent">'+esc(content)+'</div>'}
function tongueCard(){return '<section class="tongue-card" id="tongueCard"><div class="tongue-doctor"><img src="'+ASSETS.avatar+'"><h4>李浩医生 <span class="online">● 在线</span></h4><p>中医科 · 医生身份与执业信息以正式配置为准</p><div class="doctor-badges"><span>平台已验证</span><span>执业信息可查</span></div></div><div class="tongue-guide"><p>请在光线充足处自然伸舌，镜头正对舌面，拍清舌尖、舌中和舌根。避免滤镜；刚吃过明显染色食物时，待颜色恢复后再拍。</p><div class="tongue-examples"><figure><figcaption>◉ 自然伸舌</figcaption><img src="'+ASSETS.tongueGood+'"></figure><figure><figcaption>⊗ 避免有颜色</figcaption><img src="'+ASSETS.tongueBad+'"></figure></div></div><div class="privacy">ⓘ 舌部照片仅用于本次中医分析。页面实际隐私说明与保存策略应以正式产品配置为准。</div><div class="upload-actions"><button class="upload-action" data-upload="camera"><b>▣　拍照</b><span>去拍照</span></button><button class="upload-action" data-upload="album"><b>▧　上传照片</b><span>去上传</span></button></div></section>'}
function summaryParagraphs(c){if(!state.tongueSkipped)return c.summary;if(c.number===2)return ['目前先调整睡眠和三餐，不急着服西洋参。结合近两周下午轻度乏力、偶尔口干和经常晚睡，目前不足以判断为气阴两虚，也没有必须进补的依据。本次未完成舌诊，因此不引用舌象。您正在服用氨氯地平，若后续仍想尝试，请先让医生核对产品、用法和近期血压。',c.summary[1]];if(c.number===4)return ['白痰不能只归因于脾虚。结合胃口差、大便偶尔黏，可以关注脾胃运化偏弱和痰湿倾向；本次未完成舌诊，也不能替代呼吸道和鼻咽评估。可以先规律三餐、减少甜腻油炸；白痰已持续三周，建议近期到全科或呼吸科评估，出现发热、气短或痰血时及时就医。',c.summary[1]];return c.summary}
function summaryCard(c){return '<section class="summary-card" id="summaryCard"><h3>病情小结</h3>'+summaryParagraphs(c).map(p=>'<p>'+esc(p)+'</p>').join('')+'</section>'}
function serviceRow(c){
 const critical=c.number>=7&&!state.stable;const reportOk=!!c.report&&!critical;const consultOk=!critical;
 return '<div class="service-row"><button class="service-chip '+(c.number===1||c.number===4?'primary':'')+'" data-service="consult" '+(consultOk?'':'disabled')+'><span class="chip-icon">♧</span>咨询医生</button><button class="service-chip '+(reportOk?'primary':'')+'" data-service="report" '+(reportOk?'':'disabled')+'><span class="chip-icon">▣</span>详细报告</button></div>';
}
function followups(c){if(!c.followups.length)return '';return '<div class="followups">'+c.followups.map((x,i)=>{const tongue=x.includes('中医舌诊');const can=tongue&&c.number===3&&state.stage==='report';return '<button class="followup '+(can?'clickable':'')+'" data-follow="'+i+'" '+(can?'':'disabled')+'>'+esc(x)+'</button>'}).join('')+'</div>'}

function summaryCard(c){return '<section class="summary-card" id="summaryCard"><h3>病情小结</h3>'+c.summary.map(p=>'<p>'+esc(p)+'</p>').join('')+'</section>'}
function followups(c){if(!c.followups.length)return '';return '<div class="followups">'+c.followups.map((x,i)=>{const can=c.number===3&&x.includes('中医舌诊')&&state.stage==='result';return '<button class="followup '+(can?'clickable':'')+'" data-follow="'+i+'" '+(can?'':'disabled')+'>'+esc(x)+'</button>'}).join('')+'</div>'}
function leadCard(){return '<section class="lead-card" id="leadCard"><div class="lead-profile"><img src="'+ASSETS.doctor+'"><div><h3>李浩医生</h3><p>中医科 · 企业微信承接</p><div class="badges"><span>平台已验证</span><span>执业信息可查</span></div></div></div><button class="lead-action" id="leadAction">添加企业微信，联系医生</button><p class="lead-privacy">ⓘ 点击提交即表示同意医生团队与您联系，信息仅用于本次健康咨询与后续服务。</p></section>'}
function reportCard(c){const r=c.report,tab=state.reportTab||r.defaultTab;const tabs=Object.keys(r.tabs);const buttons=tabs.map(x=>'<button class="report-tab '+(x===tab?'active':'')+'" data-tab="'+x+'">'+x+'</button>').join('');return '<section class="report-card" id="reportCard"><div class="report-hero"><div class="eyebrow">DETAILED REPORT</div><h3>详细报告</h3><p>'+esc(r.diagnostic)+'</p></div><div class="report-evidence"><h4>症状与推断凭据</h4><ul>'+r.evidence.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div><div class="report-advice"><b>建议：</b>'+esc(r.advice)+'</div><div class="report-tabs" style="--tab-count:'+tabs.length+'">'+buttons+'</div><div class="report-tab-body" id="reportTabBody">'+r.tabs[tab]+'</div></section>'}
function resultVisible(c){return state.round===c.rounds.length-1&&(!c.rounds[c.rounds.length-1].tonguePrompt||state.stage!=='dialogue')}
function renderChat(){const c=caseData();let out='';for(let i=0;i<=state.round;i++){const r=c.rounds[i];out+=message('user',r.user,r.speaker);if(r.agent)out+=message('agent',r.agent)}
 const done=resultVisible(c);if(state.round===c.rounds.length-1&&c.rounds[c.rounds.length-1].tonguePrompt&&state.stage==='dialogue'){if(c.tongueAgent)out+=message('agent',c.tongueAgent);out+=tongueCard(c)}
 if(done){if(c.tongueFeedback&&state.tongueCompleted)out+=message('agent',c.tongueFeedback);out+=c.resultType==='report'?reportCard(c):summaryCard(c);if(c.leadPrompt)out+=message('agent',c.leadPrompt);out+=leadCard()+followups(c)}
 if(state.stage==='tongueAfterReport')out+=message('user','中医舌诊查看更准确信息')+message('agent','可以。麻烦按提示上传一张清晰舌照，我会结合您的饭后胃胀一起看，判断偏食滞还是偏脾虚。舌象判断不了两个产品会不会相互作用，那部分还是要看成分。')+tongueCard(c,true);
 if(state.stage==='tongueReport')out+=message('user','已上传舌照')+tongueReportCard(c)+(c.tongueReport&&c.tongueReport.agent?message('agent',c.tongueReport.agent):'');
 $('chat').innerHTML=out;bindChat(c,done);requestAnimationFrame(()=>{const target=state.stage==='tongueReport'?$('tongueReport'):state.stage==='tongueAfterReport'?$('tongueCard'):done?(c.resultType==='report'?$('reportCard'):$('summaryCard')):null;if(target)target.scrollIntoView({block:'start'});else $('chat').scrollTop=$('chat').scrollHeight})
}
function finishTongue(){const c=caseData();if(state.stage==='tongueAfterReport'){state.stage='tongueReport';state.organTab='脾胃'}else{state.tongueCompleted=true;state.stage='result';state.reportTab=c.report?c.report.defaultTab:null}render()}
function skipTongueV12(){const c=caseData();if(c.tongueAction!=='skip'||state.stage!=='dialogue')return;state.tongueSkipped=true;state.stage='result';state.reportTab=c.report?c.report.defaultTab:null;render()}
function bindChat(c,done){document.querySelectorAll('[data-upload]:not([disabled])').forEach(b=>b.onclick=finishTongue);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const body=$('reportTabBody');if(body)state.reportScroll[state.reportTab]=body.scrollTop;state.reportTab=b.dataset.tab;render();requestAnimationFrame(()=>{const nb=$('reportTabBody');if(nb)nb.scrollTop=Number(state.reportScroll[state.reportTab]||0)})});document.querySelectorAll('[data-organ]').forEach(b=>b.onclick=()=>{state.organTab=b.dataset.organ;render()});document.querySelectorAll('.followup.clickable').forEach(b=>b.onclick=()=>{state.stage='tongueAfterReport';render()});const lead=$('leadAction');if(lead)lead.onclick=()=>{lead.textContent='已提交，医生将通过企业微信联系';lead.disabled=true}}
function renderOptions(){const c=caseData(),r=c.rounds[state.round],last=state.round===c.rounds.length-1;let chips='',options='';if(state.stage==='dialogue'&&!last){$('composer').value=r.prefill||'';options='<div class="quick-note">'+(r.multi?'可多选；点选内容会进入输入栏，再统一发送。':'点击选项后内容会进入输入栏，再点击发送。')+'</div><div class="options">'+r.options.map(o=>'<button class="option '+(o.primary?'primary':'')+'" '+(o.primary?'':'disabled')+' data-value="'+esc(o.label)+'" data-multi="'+(r.multi?'1':'0')+'">'+esc(o.label)+'</button>').join('')+'</div>'}
 else if(state.stage==='dialogue'&&last&&r.tonguePrompt){const enabled=c.tongueAction==='skip';chips='<button class="mini-chip '+(enabled?'route-primary':'')+'" id="skipTongue" '+(enabled?'':'disabled')+'>▱ 跳过中医舌诊</button>'}
 else if(state.stage==='tongueAfterReport'){chips='<button class="mini-chip" disabled>▱ 跳过中医舌诊</button>'}
 $('composerChips').innerHTML=chips;if(options)$('chat').insertAdjacentHTML('beforeend',options);document.querySelectorAll('.option.primary').forEach(b=>b.onclick=()=>fillComposer(b.dataset.value,b.dataset.multi==='1'));const skip=$('skipTongue');if(skip)skip.onclick=skipTongueV12;const locked=state.stage!=='dialogue'||last;$('composer').disabled=locked;$('send').disabled=locked}
function sendCurrent(){const c=caseData(),input=$('composer'),value=input.value.trim();if(!value||state.stage!=='dialogue'||state.round>=c.rounds.length-1)return;const expected=c.rounds[state.round+1].user,r=c.rounds[state.round],primaries=r.options.filter(x=>x.primary).map(x=>normalize(x.label)),normalized=normalize(value);const match=normalize(expected)===normalized||(primaries.length&&primaries.every(x=>normalized.includes(x)));if(!match){input.value='';input.placeholder='请点选本演示主线中的高亮选项';return}state.round++;input.value='';if(state.round===c.rounds.length-1&&!c.rounds[state.round].tonguePrompt)state.stage='result';render()}
function capabilities(c,r,done){if(c.number>=7)return [['病情小结','on'],['舌诊','stop'],['详细报告','stop'],['留资卡','on']];if(state.stage==='tongueAfterReport')return [['主动舌诊','on'],['原报告回填','stop'],['跳过入口','on']];if(state.stage==='tongueReport')return [['独立舌诊报告','on'],['既有报告改写','stop'],['用药结论','stop']];if(state.stage==='dialogue'&&r.tonguePrompt)return [['中医舌诊','on'],['允许跳过','on'],['结果生成','stop']];if(done)return [[c.resultType==='report'?'详细报告':'病情小结','on'],['留资卡','on']];return [['主问诊','on'],['逐轮重判','on'],['提前结论','stop']]}
function activeTrace(c){if(state.stage==='tongueAfterReport')return {health:c.health,need:c.need,basis:'用户在详细报告与留资卡之后主动选择补做舌诊；此时尚未获得舌象。',next:'展示舌诊采集卡；完成后另出独立舌诊报告，原报告保持不变。'};if(state.stage==='tongueReport')return {health:c.health,need:c.need,basis:'用户在既有报告之后主动完成舌诊；新舌象仅用于生成独立舌诊报告，不回填此前内容。',next:'结合本次问题解释舌象，并保持原有用药核对与安全边界。'};if(state.stage==='result'&&c.tongueTrace)return c.tongueTrace;return c.rounds[state.round].trace}
function strategyReason(c,r,done){if(c.number>=7)return '命中警讯后停止常规问询；不做舌诊和详细报告，直接输出就医小结并同步真人。';if(state.stage==='tongueAfterReport')return '用户主动进入舌诊分支；上传前允许跳过，既有详细报告保持原样。';if(state.stage==='tongueReport')return '独立报告只解释新获得的舌象，不倒填此前详细报告。';if(state.stage==='dialogue'&&r.tonguePrompt)return '舌诊仅补充当前中医判断；上传完成才算已做，跳过后报告不得引用舌象。';if(done)return c.resultType==='report'?'问询结束后直接展开详细报告，并在其下方同步留资卡。':'问询结束后直接输出病情小结，并在其下方同步留资卡。';return '每轮先承接新信息，再推进一个会改变判断或交付的变量。'}
function doctorData(c){const d={...c.doctorCard};if(c.number===3&&state.stage!=='tongueReport'){d.opening='您的情况我看过了：饭后胃胀不到一周，没有黑便、呕吐、持续加重或夜间痛醒；健脾散还没开始吃，尼可地尔5毫克每天3次在服，本次问诊阶段没有拍舌照。\n\n尼可地尔本身有胃肠溃疡的已知风险，健脾散先不要开始。麻烦您把包装正面、成分配料表和批准文号拍清楚发我，我来核对能不能合用、什么时候吃、是否需要错开。\n\n胃胀如果明显加重，或者出现持续腹痛、黑便、呕血，马上在微信告诉我，我来安排下一步。';}if(c.number===3&&state.stage==='tongueReport'){d.facts+='；报告后用户主动完成舌诊，见舌质淡红、舌中苔白稍腻、舌体未见明显胖大、舌面尚润。';}return d}
function renderTrace(){const c=caseData(),r=c.rounds[state.round],t=activeTrace(c),done=resultVisible(c),currentUser=state.stage==='tongueReport'?'已上传舌照':state.stage==='tongueAfterReport'?'中医舌诊查看更准确信息':state.stage==='result'&&c.tongueTrace?(c.tongueAction==='upload'?'已上传舌照':'跳过中医舌诊'):r.user;let h='<div class="state-grid"><div class="state health"><span>健康问题程度</span><strong>'+esc(t.health||c.health)+'</strong><p>'+esc(t.basis)+'</p></div><div class="state need"><span>解决需求程度</span><strong>'+esc(t.need||c.need)+'</strong><p>需求影响解释深度与承接节奏，不降低安全下限。</p></div></div><div class="trace-card"><h3>01　本轮新增信息</h3><div class="fact-tags">'+String(currentUser).split(/[；、，。]/).filter(Boolean).slice(0,8).map(x=>'<span>'+esc(x)+'</span>').join('')+'</div></div><div class="trace-card"><h3>02　用户信息理解</h3><p>'+esc(t.basis)+'</p></div><div class="trace-card"><h3>03　本轮策略与下一动作</h3><div class="strategy-box"><b>'+esc(t.next)+'</b><p>'+strategyReason(c,r,done)+'</p></div></div>';if(done)h+=doctorCard(c);$('trace').innerHTML=h;$('round').textContent=state.stage==='tongueAfterReport'?'主动舌诊':state.stage==='tongueReport'?'舌诊报告':done?(c.resultType==='report'?'详细报告':'病情小结'):'第 '+(state.round+1)+' / '+(c.rounds.length-1)+' 轮'}
function render(){renderChat();renderOptions();renderTrace();document.querySelectorAll('.case-cell').forEach(b=>b.classList.toggle('active',Number(b.dataset.index)===state.caseIndex))}
function renderRules(){const colors={'轻症':'#55b8aa','中症':'#e2a449','重症':'#dd6170'},healths=['轻症','中症','重症'],needs=['轻需求','中需求','重需求'];let h='<div class="rule-title"><h2>九宫格判定与策略</h2><p>健康问题程度决定安全下限，解决需求强度决定服务方式与承接节奏。横向为健康问题程度，纵向为解决需求强度。</p></div><div class="strategy-matrix"><div></div>'+healths.map(x=>'<div class="strategy-axis">'+x+'</div>').join('');needs.forEach((need,row)=>{h+='<div class="strategy-axis row">'+need+'</div>';healths.forEach((health,col)=>{const s=STRATEGIES[col*3+row];h+='<button class="strategy-cell" style="--level:'+colors[health]+'" data-strategy="'+s.number+'"><h3>'+String(s.number).padStart(2,'0')+' '+s.title+'</h3><div class="strategy-line"><b>判定</b><span>'+esc(s.verdict)+'</span></div><div class="strategy-line"><b>Agent</b><span>'+esc(s.agent)+'</span></div><div class="strategy-line"><b>私域</b><span>'+esc(s.private)+'</span></div></button>'})});h+='</div>';$('ruleContent').innerHTML=h;document.querySelectorAll('[data-strategy]').forEach(b=>b.onclick=()=>openStrategy(Number(b.dataset.strategy)))}
function openStrategy(number){const s=STRATEGIES.find(x=>x.number===number);if(!s)return;const blocks=[['判定标准',s.criteria],['Agent 阶段策略与交付',s.agentStrategy],['转入私域的时机与交接',s.handoff],['私域首次承接动作',s.firstAction],['运营 SOP 与升级结束边界',s.sop]];$('strategyDrawer').innerHTML='<div class="drawer-head"><div><div class="eyebrow">CASE '+String(number).padStart(2,'0')+'</div><h2>'+esc(s.title)+'</h2></div><button class="drawer-close" id="drawerClose">×</button></div>'+blocks.map(x=>'<section class="detail-block"><b>'+x[0]+'</b><p>'+esc(x[1])+'</p></section>').join('');$('strategyBackdrop').classList.add('open');$('drawerClose').onclick=closeStrategy}
function closeStrategy(){$('strategyBackdrop').classList.remove('open')}
$('strategyBackdrop').onclick=e=>{if(e.target===$('strategyBackdrop'))closeStrategy()};
$('miniAvatar').src=ASSETS.avatar;$('send').onclick=sendCurrent;$('composer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendCurrent()}});$('resetCase').onclick=reset;document.querySelectorAll('.nav button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b===btn));$('demoView').classList.toggle('active',btn.dataset.view==='demo');$('rulesView').classList.toggle('active',btn.dataset.view==='rules')});buildGrids();renderRules();selectCase(0);
</script>
</body>
